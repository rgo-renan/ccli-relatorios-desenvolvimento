<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body><title>Relatórios de Desenvolvimento CCLi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital@1&family=Sora:wght@600;700&display=swap">
<style id="app-css">/* Layout: faixa de cabeçalho teal + área de trabalho; lista densa e editor em duas colunas (controles | prévia A4) */
:root{
  --bg:#f3f1ec; --surface:#ffffff; --surface2:#f8f7f3; --ink:#1b2726; --mut:#62706d; --line:#e2ded5;
  --teal:#154843; --teal-ink:#ffffff; --mint:#2f9e82; --mint-soft:#dff1ea; --orange:#d97a4a; --orange-soft:#fbe8dc;
  --ok:#2f8f5b; --ok-soft:#e1f2e8; --warn:#b26a12; --warn-soft:#fbefd9; --bad:#b4442f; --bad-soft:#f8e1dc;
  --focus:#2f9e82;
  --f-disp:Sora,"Segoe UI",system-ui,sans-serif; --f-body:Inter,system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111817; --surface:#18211f; --surface2:#1d2826; --ink:#e7eeec; --mut:#9aaaa6; --line:#2b3835;
  --teal:#0f3531; --teal-ink:#eaf5f2; --mint:#58c9a8; --mint-soft:#1d3a33; --orange:#ef9a6d; --orange-soft:#3b2a20;
  --ok:#6fd09a; --ok-soft:#1c3427; --warn:#f0b35e; --warn-soft:#3a2d17; --bad:#f08f7b; --bad-soft:#3d221d; --focus:#58c9a8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111817; --surface:#18211f; --surface2:#1d2826; --ink:#e7eeec; --mut:#9aaaa6; --line:#2b3835;
  --teal:#0f3531; --teal-ink:#eaf5f2; --mint:#58c9a8; --mint-soft:#1d3a33; --orange:#ef9a6d; --orange-soft:#3b2a20;
  --ok:#6fd09a; --ok-soft:#1c3427; --warn:#f0b35e; --warn-soft:#3a2d17; --bad:#f08f7b; --bad-soft:#3d221d; --focus:#58c9a8; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
header.top{background:var(--teal);color:var(--teal-ink)}
header.top .wrap{padding-block:18px 16px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:14px;align-items:center}
.brand .lg{background:#fff;border-radius:10px;padding:6px 9px;display:flex}
.brand .lg img{height:24px;display:block}
.brand h1{font-family:var(--f-disp);font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand p{margin:2px 0 0;font-size:12px;opacity:.75}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;gap:6px;align-items:center;border-radius:99px;padding:4px 10px;font-size:12px;background:rgba(255,255,255,.1);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:#7fd3bb;display:inline-block}
.pill.off i{background:#e8946a}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500;display:inline-flex;gap:7px;align-items:center;justify-content:center;white-space:nowrap}
.btn:hover{border-color:var(--mint)}
.btn.pri{background:var(--mint);border-color:var(--mint);color:#fff}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost-on-dark{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:var(--teal-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{padding:5px 10px;font-size:12.5px}
main{padding-block:18px 90px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.upl{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:10px 0 12px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;cursor:pointer;background:var(--surface2);position:relative}
.drop:hover,.drop.over{border-color:var(--mint)}
.drop b{font-family:var(--f-disp);font-size:13.5px}
.drop span{font-size:12px;color:var(--mut)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.drop.err{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--mut)}
.small{font-size:12.5px}
.tabs{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:3px}
.tabs button{border:0;background:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500;color:var(--mut)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs button em{font-style:normal;font-size:11.5px;color:var(--mut);margin-left:4px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.field{display:grid;gap:4px}
.field>span{font-size:11.5px;color:var(--mut);font-weight:500}
input[type=text],input[type=search],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical;line-height:1.45}
.chk{display:inline-flex;gap:7px;align-items:center;cursor:pointer;font-size:13px;user-select:none}
.chk input{accent-color:var(--mint);width:16px;height:16px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sum b{display:block;font-family:var(--f-disp);font-size:22px;font-variant-numeric:tabular-nums}
.sum span{font-size:12px;color:var(--mut)}
.sum.hot{border-color:var(--orange);background:var(--orange-soft)}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:1080px;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;font-weight:600;color:var(--mut);background:var(--surface2);position:sticky;top:0;white-space:nowrap}
th.s{cursor:pointer}
th.s:hover{color:var(--ink)}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface2)}
tr.sel{background:var(--mint-soft)!important}
td.nm b{font-weight:600}
td.nm small{display:block;color:var(--mut);font-size:11.5px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:2px 7px;font-size:11.5px;font-weight:600;white-space:nowrap}
.tag.ins{background:var(--mint-soft);color:var(--mint)}
.tag.pro{background:var(--surface2);color:var(--mut);border:1px solid var(--line)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.tri{background:var(--orange-soft);color:var(--orange)}
.meter{display:inline-block;width:46px;height:6px;border-radius:4px;background:var(--line);vertical-align:middle;margin-right:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--mint)}
.meter i.mid{background:var(--warn)}
.meter i.low{background:var(--bad)}
.actbar{position:fixed;left:0;right:0;bottom:0;background:var(--teal);color:var(--teal-ink);z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
.actbar .wrap{padding-block:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.empty{padding:48px 20px;text-align:center;color:var(--mut)}
.empty h2{font-family:var(--f-disp);color:var(--ink);font-size:20px;margin:0 0 6px}
.note{border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5}
.note.warn{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn)}
.note.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.note.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.note b.t{display:block;font-family:var(--f-disp);margin-bottom:4px}
.msgbox{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12.5px;margin:8px 0}
/* editor */
.ed{display:grid;grid-template-columns:minmax(330px,420px) minmax(0,1fr);gap:18px;align-items:start}
.ed-side{display:grid;gap:12px}
.ed-side .panel{padding:14px}
.ed-side h3{font-family:var(--f-disp);font-size:14px;margin:0 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .full{grid-column:1/-1}
.who-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.who-h h2{font-family:var(--f-disp);font-size:18px;margin:0}
.chips-a{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qnav{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--mut)}
details.tx{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
details.tx summary{cursor:pointer;font-weight:600;font-size:13px;padding:4px 0}
.txf{display:grid;gap:4px;margin-top:8px}
.txf label{font-size:11.5px;color:var(--mut);font-weight:500}
.prev{position:sticky;top:12px}
.prev-box{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px;overflow:hidden}
.prev-scale{transform-origin:top left}
.prev-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:50;max-width:min(92vw,520px)}
#offscreen{position:fixed;left:-12000px;top:0;width:794px}
@media (max-width:900px){.ed{grid-template-columns:1fr}.prev{position:static}}
@media (max-width:520px){.grid2{grid-template-columns:1fr}.brand h1{font-size:17px}}
</style>
<style id="report-css">/* ===== Relatório A4 (documento: tema fixo claro) ===== */
.rp{--r-teal:#154843;--r-teal2:#1d5a53;--r-mint:#45b89b;--r-mint2:#e2f3ed;--r-mint3:#c9e9df;--r-or:#e8946a;--r-or2:#fcebe1;--r-cream:#f8f6f1;--r-ink:#1e2a29;--r-mut:#6c7876;--r-line:#e7e3db;--r-card:#ffffff;
  font-family:Inter,system-ui,sans-serif;color:var(--r-ink);color-scheme:light}
.rp *{box-sizing:border-box}
.pg{width:794px;height:1123px;background:var(--r-cream);position:relative;overflow:hidden;display:flex;flex-direction:column;padding:34px 46px 26px}
.pg + .pg{margin-top:24px}
.rp h1,.rp h2,.rp h3,.rp h4{font-family:Sora,Inter,sans-serif;margin:0;text-wrap:balance}
.rp :where(p){margin:0}
.rp .eb{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--r-mint)}
.rp .hl{color:var(--r-mint)}
.rp b,.rp strong{font-weight:600}
.pg-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.pg-top img{height:30px}
.pg-top span{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--r-mut)}
.pg-foot{margin-top:auto;border-top:1px solid var(--r-line);padding-top:9px;display:flex;justify-content:space-between;font-size:8.5px;color:var(--r-mut)}
.sec-h{font-size:27px;line-height:1.12;font-weight:700;margin:6px 0 8px}
.sec-i{font-size:12.2px;line-height:1.6;color:#3b4847;max-width:640px}
/* capa */
.cover{background:var(--r-teal);margin:-34px -46px 0;padding:34px 46px 30px;color:#fff;position:relative;overflow:hidden;min-height:540px;display:flex;flex-direction:column}
.cover .rings{position:absolute;right:-120px;top:-150px;width:520px;height:520px;border-radius:50%;border:1px solid rgba(255,255,255,.12)}
.cover .rings:after{content:"";position:absolute;inset:60px;border-radius:50%;border:1px solid rgba(232,148,106,.45)}
.cover .rings:before{content:"";position:absolute;inset:-60px;border-radius:50%;border:1px solid rgba(255,255,255,.07)}
.cover .lg{background:#fff;border-radius:12px;padding:8px 12px;display:inline-flex;width:max-content}
.cover .lg img{height:28px}
.cover .eb{margin-top:46px;color:#7fd3bb}
.cover h1{font-size:44px;line-height:1.06;font-weight:700;margin-top:12px;letter-spacing:-.01em}
.cover h1 .hl{color:#5fcbab}
.cover .sub{margin-top:16px;font-size:13px;line-height:1.6;max-width:470px;color:#dbe9e5}
.meta{margin-top:auto;padding-top:38px;display:grid;grid-template-columns:repeat(4,auto);justify-content:start;gap:12px 46px}
.meta small{display:block;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:#8fc9b9;margin-bottom:6px}
.meta b{font-size:13px;font-weight:600}
.carta{font-size:12.4px;line-height:1.65;margin:26px 0 18px;color:#2b3837}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--r-card);border:1px solid var(--r-line);border-radius:12px;padding:14px 14px 12px}
.kpi b{display:block;font-family:Sora,sans-serif;font-size:24px;font-weight:700;color:var(--r-teal);line-height:1.1}
.kpi b small{font-size:13px}
.kpi span{display:block;margin-top:6px;font-size:9.8px;line-height:1.45;color:var(--r-mut)}
.kpi.on{background:var(--r-mint);border-color:var(--r-mint)}
.kpi.on b,.kpi.on span{color:#fff}
.quote{margin:20px 0 6px;border-left:3px solid var(--r-or);padding:2px 0 2px 16px}
.quote p{font-family:Lora,Georgia,serif;font-style:italic;font-size:16px;line-height:1.45;color:#2b3837}
.quote small{display:block;margin-top:6px;font-size:9.5px;color:var(--r-or)}
.idx{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:auto;margin-bottom:14px;padding-top:16px;border-top:1px solid var(--r-line)}
.idx div{font-size:9.5px;color:var(--r-mut);line-height:1.4}
.idx em{font-style:normal;display:block;font-family:Sora,sans-serif;color:var(--r-mint);font-weight:700;font-size:13px}
.idx strong{display:block;color:var(--r-ink);font-size:11.5px;font-weight:600;margin:3px 0 1px}
/* página 2 */
.prog{background:var(--r-card);border:1px solid var(--r-line);border-radius:16px;padding:18px 20px;margin-top:14px}
.prog-h{display:flex;justify-content:space-between;align-items:flex-end}
.prog-h .big{font-family:Sora,sans-serif;font-size:30px;font-weight:700;color:var(--r-teal)}
.prog-h .big span{font-family:Inter;font-size:13px;font-weight:400;color:var(--r-mut);margin-left:6px}
.prog-h .cur{text-align:right;font-size:9.5px;color:var(--r-mut)}
.prog-h .cur b{display:block;font-family:Sora,sans-serif;font-size:18px;color:var(--r-or)}
.bar{height:7px;background:var(--r-mint2);border-radius:9px;margin:10px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--r-teal2),var(--r-mint));border-radius:9px}
.lvrow{display:flex;align-items:center;gap:8px;margin:6px 0}
.lvrow>b{width:32px;font-family:Sora,sans-serif;font-size:11px}
.lvbox{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.lvbox span{flex:1;min-width:18px;height:22px;border-radius:5px;display:grid;place-items:center;font-size:8.5px;font-weight:600;border:1px dashed #cfd8d5;color:#9aa6a3;background:#fff}
.lvbox span.d{background:var(--r-mint);border:0;color:#fff}
.lvbox span.base{background:var(--r-mint3);border:0;color:var(--r-teal)}
.lvbox span.c{background:var(--r-or);border:0;color:#fff}
.lvnext{background:#25302f;color:#fff;border-radius:6px;font-family:Sora,sans-serif;font-size:10px;font-weight:700;padding:5px 10px}
.legend{display:flex;gap:16px;font-size:8.8px;color:var(--r-mut);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.agora{margin-top:12px;background:var(--r-or2);border-radius:10px;padding:10px 14px;font-size:10.8px;line-height:1.55;color:#7a4b33}
.agora b{color:#c46a3f}
.marcos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.marco{background:var(--r-card);border:1px solid var(--r-line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column}
.marco h4{font-size:13.2px;margin:4px 0 8px}
.marco ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.marco li{font-size:10.4px;line-height:1.45;color:#3b4847;padding-left:14px;position:relative}
.marco li:before{content:"";position:absolute;left:0;top:5px;width:7px;height:7px;border-radius:50%;background:var(--r-mint)}
.marco .pv{margin-top:auto;padding-top:10px;border-top:1px solid var(--r-line);margin-top:10px;font-size:9.8px;color:#3b4847}
.marco .pv b{color:var(--r-teal)}
.tools{margin-top:12px;background:var(--r-mint2);border-radius:14px;padding:14px 16px}
.tools h4{font-size:11.5px;font-weight:600;margin-bottom:9px}
.tools h4 span{font-family:Inter;font-weight:400;color:var(--r-mut);font-size:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:#fff;border-radius:99px;padding:4px 10px;font-size:9.4px;color:#2b3837}
/* página 3 */
.g2{display:grid;grid-template-columns:1.05fr 1fr;gap:14px;margin-top:12px}
.card{background:var(--r-card);border:1px solid var(--r-line);border-radius:16px;padding:16px 18px}
.card h4{font-size:13px}
.card .cap{font-size:9.4px;color:var(--r-mut);margin:2px 0 12px}
.months{display:grid;gap:5px}
.months .mt{display:grid;place-items:center;height:40px;border-radius:7px;background:var(--r-mint);color:#fff;font-family:Sora,sans-serif;font-size:11.5px;font-weight:700}
.months .mt.mid{background:var(--r-mint3);color:var(--r-teal)}
.months .mt.low{background:#f2ddd2;color:#a65a35}
.months small{display:block;text-align:center;font-size:8.6px;color:var(--r-mut);margin-top:4px}
.streak{display:flex;gap:12px;align-items:center;background:var(--r-or2);border-radius:10px;padding:10px 12px;margin-top:12px}
.streak b{font-family:Sora,sans-serif;font-size:26px;color:var(--r-or)}
.streak p{font-size:9.8px;line-height:1.45;color:#7a4b33}
.years{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.years div{border:1px solid var(--r-line);border-radius:10px;padding:10px 12px}
.years small{font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--r-mut)}
.years b{display:block;font-family:Sora,sans-serif;font-size:21px;color:var(--r-teal);margin:3px 0}
.years span{font-size:9.4px;color:var(--r-mut)}
.cmp{display:grid;gap:12px}
.cmp .r{font-size:10.4px}
.cmp .r div{display:flex;justify-content:space-between;margin-bottom:5px}
.cmp .r i{display:block;height:12px;border-radius:6px;background:#efebe4;overflow:hidden}
.cmp .r i u{display:block;height:100%;background:#d5cfc5;border-radius:6px}
.cmp .r.me i u{background:var(--r-mint)}
.cmp .r.me{font-weight:600}
.badge{margin-top:14px;background:var(--r-teal);color:#fff;border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.badge b{font-family:Sora,sans-serif;font-size:24px;color:#7fd3bb;white-space:nowrap}
.badge p{font-size:10px;line-height:1.45}
.sep-h{margin-top:18px}
.olhar{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-top:10px}
.olhar .q{position:relative;padding-right:54px}
.olhar .q:after{content:"\201D";position:absolute;right:16px;top:-4px;font-family:Lora,serif;font-size:70px;color:var(--r-mint3)}
.olhar .q p{font-family:Lora,Georgia,serif;font-style:italic;font-size:13.2px;line-height:1.55;color:#2b3837;margin-bottom:10px}
.olhar .q p.plain{font-family:Inter,sans-serif;font-style:normal;font-size:11px;line-height:1.6;color:#3b4847}
.who{display:flex;gap:10px;align-items:center;margin-top:12px}
.who i{width:32px;height:32px;border-radius:50%;background:var(--r-mint);color:#fff;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700}
.who b{display:block;font-size:10.5px}
.who span{font-size:9.4px;color:var(--r-mut)}
.check{background:var(--r-mint2);border-radius:16px;padding:16px 18px}
.check h4{font-size:12.5px;margin-bottom:10px}
.check ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.check li{font-size:10.2px;line-height:1.45;padding-left:22px;position:relative;color:#2b3837}
.check li:before{content:"✓";position:absolute;left:0;top:-1px;width:15px;height:15px;border-radius:50%;background:var(--r-mint);color:#fff;font-size:9px;display:grid;place-items:center}
.fn{font-size:8.5px;color:var(--r-mut)}
/* página 4 */
.g4{display:grid;grid-template-columns:1fr 1.05fr;gap:14px;margin-top:14px;align-items:start}
.rest{display:grid}
.rest div{display:grid;grid-template-columns:44px 1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--r-line);font-size:10.3px;line-height:1.4}
.rest div:last-child{border:0}
.rest b{font-family:Sora,sans-serif;font-size:10px;color:var(--r-teal)}
.rest .now b,.rest .now em{color:var(--r-or)}
.rest em{font-style:normal;font-size:8.5px;align-self:center}
.dark{background:var(--r-teal);color:#fff;border-radius:16px;padding:20px 20px}
.dark .eb{color:#7fd3bb}
.dark h3{font-size:18px;line-height:1.25;margin:6px 0 8px}
.dark p{font-size:10.4px;line-height:1.55;color:#cfe3dd}
.dark ul{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
.dark li{font-size:10.3px;line-height:1.45;padding-left:16px;position:relative}
.dark li:before{content:"→";position:absolute;left:0;color:#7fd3bb}
.dark .tm{margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.15)}
.dark .tm small{font-size:8.6px;color:#9cc7bb}
.dark .chips{margin-top:7px}
.dark .chips span{background:rgba(255,255,255,.1);color:#fff}
.now-box{background:var(--r-card);border:1px solid var(--r-line);border-radius:16px;padding:18px}
.now-box h4{font-size:15px;margin:4px 0 8px}
.now-box p{font-size:10.6px;line-height:1.55;color:#3b4847}
.now-box .nx{margin-top:12px;display:flex;gap:10px;align-items:center;font-size:10.4px}
.now-box .nx b{background:#25302f;color:#fff;border-radius:6px;padding:4px 9px;font-family:Sora,sans-serif;font-size:10px}
.acel{margin-top:12px;background:var(--r-or2);border-radius:14px;padding:14px 16px}
.acel .eb{color:#c46a3f}
.acel h4{font-size:12.5px;margin:4px 0 6px;color:#7a4b33}
.acel p{font-size:10px;line-height:1.5;color:#7a4b33}
.acel ul{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:5px}
.acel li{font-size:10px;line-height:1.45;color:#7a4b33;padding-left:14px;position:relative}
.acel li:before{content:"→";position:absolute;left:0}
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;border-top:1px solid var(--r-line);padding-top:14px;margin-top:auto}
.team b{display:block;font-size:11px}
.team span{font-size:9.2px;color:var(--r-mut)}
.close{text-align:center;margin:18px 0 6px}
.close p{font-family:Lora,Georgia,serif;font-style:italic;font-size:14px}
.close small{display:block;font-size:9.2px;color:var(--r-mut);margin-top:4px}
</style>

<script type="application/json" id="d-rota">[{"id":"A1.1","lvl":"A1","n":1,"name":"Primeiros contatos","comp":"Apresentar-se a novas pessoas, fornecer informações básicas sobre si (nome, origem, profissão) e usar cumprimentos adequados ao contexto.","gram":"basic questions, letter sounds, subject personal pronouns, syllable stress","vocab":"age, greetings, job, name, origin, personal information, spelling, the alphabet","prof":"Apresentar-se é a primeira coisa que acontece em qualquer contexto profissional — numa entrevista, numa reunião com cliente, ao entrar em uma nova equipe. No A1, o aluno aprende exatamente o vocabulário e as estruturas dessa situação: nome, cargo, empresa, origem. O tema é 100% profissional desde o início.","hab":"Habilidades Sociais e Interpessoais"},{"id":"A1.2","lvl":"A1","n":2,"name":"Pessoas próximas","comp":"Descrever pessoas do seu círculo próximo (família, colegas) usando adjetivos simples de aparência e personalidade.","gram":"genitive case, possessive adjectives","vocab":"family members, personality, physical appearance","prof":"No trabalho, falar sobre a própria família ou perguntar sobre a de um colega é parte natural do small talk — especialmente em culturas como a americana, onde esse tipo de conversa cria rapport. Além disso, entender como descrever pessoas (aparência, personalidade) prepara o aluno para falar sobre membros da equipe ou clientes.","hab":"Empatia e Inteligência Emocional"},{"id":"A1.3","lvl":"A1","n":3,"name":"Preferências e pedidos de comida","comp":"Expressar preferências alimentares e fazer pedidos simples em restaurantes ou lanchonetes.","gram":"can, would like","vocab":"food and drink","prof":"Almoços de negócios, happy hours com clientes e jantares em viagens corporativas fazem parte da rotina profissional. Saber pedir comida, expressar preferências e recusar educadamente são competências reais — e situações onde errar em inglês gera desconforto perceptível.","hab":"Autonomia e Autogestão"},{"id":"A1.4","lvl":"A1","n":4,"name":"Interesses e tempo livre","comp":"Falar sobre interesses pessoais e combinar atividades de lazer com pessoas conhecidas.","gram":"likes and dislikes, present simple, subject personal pronouns","vocab":"days, free time activities, invitations","prof":"O tema do lazer pode parecer distante do trabalho, mas é o território do small talk que abre portas em reuniões e eventos profissionais. Perguntar e responder sobre interesses é uma das formas mais comuns de construir relacionamento com colegas e clientes internacionais.","hab":"Autoconhecimento e Bem-estar"},{"id":"A1.5","lvl":"A1","n":5,"name":"Rotina e agenda","comp":"Descrever sua rotina diária e combinar horários para encontros simples.","gram":"adverbs of frequency, present simple, subject personal pronouns","vocab":"daily routine, numbers 1-60, time","prof":"Falar sobre a própria rotina é falar sobre o próprio trabalho. Horários de reunião, chegada ao escritório, tarefas do dia — tudo isso aparece neste vocabulário. O aluno que aprende presente simples e advérbios de frequência está aprendendo a descrever como trabalha.","hab":"Autogestão e Organização"},{"id":"A1.6","lvl":"A1","n":6,"name":"Tempo e estações","comp":"Falar sobre as condições do tempo e as estações do ano, e mencionar atividades associadas ao clima.","gram":"adverbs of frequency, impersonal subject, present continuous","vocab":"free time activities, seasons, vacation activities, weather","prof":"O clima é o tema de abertura de conversas profissionais em inglês em todo o mundo — especialmente com interlocutores internacionais. \"How's the weather over there?\" é uma abertura real de chamadas de vídeo com parceiros globais. Além disso, falar sobre estações conecta ao planejamento de calendário e viagens de negócios.","hab":"Adaptabilidade e Flexibilidade"},{"id":"A1.7","lvl":"A1","n":7,"name":"Origens e cidades","comp":"Informar de onde você e outras pessoas são e fazer uma descrição simples de sua cidade (localização, tamanho, pontos de referência).","gram":"prepositions of place, there to be, wh-questions","vocab":"countries, nationalities, places","prof":"Em ambientes corporativos globais, saber perguntar e responder sobre origem — país, cidade, escritório regional — é fundamental. \"Where are you based?\" é uma das perguntas mais frequentes em conversas com colegas de outros países ou em calls internacionais.","hab":"Curiosidade e Multiculturalidade"},{"id":"A1.8","lvl":"A1","n":8,"name":"Localização e direções","comp":"Descrever a localização de lugares conhecidos e dar instruções simples para chegar a um destino.","gram":"Imperative, prepositions of place","vocab":"directions, maps, means of transportation, places","prof":"Dar e pedir instruções de localização é uma situação concreta em visitas a clientes, escritórios parceiros ou feiras de negócios. \"The meeting room is on the second floor, turn left\" — esse tipo de interação acontece em qualquer ambiente de trabalho com presença física.","hab":"Comunicação Eficaz"},{"id":"A1.9","lvl":"A1","n":9,"name":"Saúde e bem-estar","comp":"Identificar e comunicar sintomas comuns e descrever seu estado de saúde em situações simples, como uma consulta médica básica.","gram":"should","vocab":"diseases, health problems, medical conditions","prof":"Comunicar que não está bem, pedir para reagendar por questões de saúde ou perguntar sobre o estado de um colega são situações reais no ambiente profissional. Além disso, saúde e bem-estar são temas cada vez mais presentes em culturas corporativas que valorizam o cuidado com as pessoas.","hab":"Autocuidado e Bem-estar"},{"id":"A1.10","lvl":"A1","n":10,"name":"Roupas e estilo","comp":"Descrever roupas e aparência de forma simples e interagir com vendedores em situações básicas de compra.","gram":"demonstratives, wh-questions","vocab":"clothes, colors","prof":"Dress code é uma realidade em ambientes corporativos. Saber descrever o próprio estilo ou entender o código de vestimenta de um cliente ou empresa parceira é uma competência prática. Além disso, compras de uniforme, crachás ou itens para eventos da empresa entram neste território.","hab":"Autoconfiança e Expressão Pessoal"},{"id":"A1.11","lvl":"A1","n":11,"name":"Compras do dia a dia","comp":"Identificar produtos, perguntar preços e quantidades, e realizar transações simples de compra.","gram":"how much / how many, wh-questions","vocab":"numbers, prices","prof":"Transações simples em inglês — comprar algo em uma loja durante uma viagem de negócios, pedir um item no hotel, pagar uma conta — são situações que o aluno do A1 vai encontrar antes mesmo de ter fluência. Este tópico prepara para isso.","hab":"Autonomia e Consumo Consciente"},{"id":"A1.12","lvl":"A1","n":12,"name":"Hospedagem","comp":"Realizar o check-in e o check-out em um hotel, fazer pedidos básicos e comunicar necessidades simples à recepção.","gram":"can, prepositions of place, there to be, wh-questions, would like","vocab":"hotel facilities, hotel objects","prof":"Check-in em hotéis, solicitações à recepção e problemas com a reserva são situações frequentes em viagens corporativas. Mesmo um aluno A1 pode precisar navegar sozinho nesses contextos — e ter esse vocabulário faz diferença real.","hab":"Autogestão e Planejamento"},{"id":"A2.1","lvl":"A2","n":1,"name":"Entretenimento e tempo livre","comp":"Falar sobre preferências de entretenimento, recomendar filmes ou séries e combinar programas com amigos ou colegas.","gram":"adverbs of frequency, likes and dislikes, prepositions of time, present continuous, present simple","vocab":"arrangements, make suggestions, movie genres, time expressions","prof":"Falar sobre o que assiste, lê ou faz nas horas livres é parte do small talk que abre reuniões e constrói relacionamento profissional. Em culturas anglofônicas, esse tipo de conversa é esperado — e o aluno que não consegue participar dessa troca parece distante mesmo quando tem boa vontade.","hab":"Curiosidade, Criatividade e Inovação"},{"id":"A2.2","lvl":"A2","n":2,"name":"Trajetória pessoal e profissional","comp":"Descrever sua história de vida e carreira, mencionando experiências e momentos importantes do passado.","gram":"simple past, to be in the past, wh-questions","vocab":"biographies, childhood, important events, personal information","prof":"Este é um dos tópicos de maior aplicação direta: falar sobre onde estudou, onde trabalhou e como chegou onde está é o núcleo de qualquer apresentação profissional ou entrevista. O aluno usa o passado simples para contar sua história — habilidade essencial em qualquer contexto de networking ou seleção.","hab":"Autoconsciência, Autogestão e Autodireção"},{"id":"A2.3","lvl":"A2","n":3,"name":"Experiências e histórias","comp":"Narrar experiências passadas e contar histórias simples sobre viagens, descobertas ou momentos marcantes.","gram":"-ed pronunciation, irregular verbs, past continuous, regular verbs, simple past","vocab":"first times, inventions, trips","prof":"Contar experiências passadas é fundamental em conversas de negócios — \"Have you ever worked with a team in a different time zone?\" ou \"Last year we had a similar challenge\" são frases reais. O aluno aprende a narrar eventos e compartilhar histórias, o que torna a comunicação profissional mais rica e memorável.","hab":"Pensamento Crítico e Resolução de Problemas"},{"id":"A2.4","lvl":"A2","n":4,"name":"Saúde e acidentes","comp":"Descrever um acidente ou problema de saúde, comunicar sintomas e buscar orientação médica básica.","gram":"advice, can, could, gerund, should","vocab":"diseases, health problems, injuries","prof":"Comunicar um acidente de trabalho, justificar uma ausência por doença ou perguntar sobre o estado de saúde de um colega são situações concretas. Em contextos com protocolos de segurança ou equipes internacionais, saber descrever o que aconteceu com clareza pode ser crítico.","hab":"Autogestão e Autodireção"},{"id":"A2.5","lvl":"A2","n":5,"name":"Meio ambiente e sustentabilidade","comp":"Falar sobre o mundo natural, expressar opinião simples sobre questões ambientais e descrever o ambiente onde vive ou trabalha.","gram":"demonstrative pronouns, simple past, wh-questions","vocab":"animals, landscape, natural disasters, plants","prof":"Sustentabilidade é pauta corporativa. Empresas com parceiros internacionais frequentemente discutem políticas ambientais, práticas de ESG e compromissos de carbono. O aluno que consegue participar minimamente dessa conversa demonstra consciência global e relevância em contextos profissionais mais amplos.","hab":"Multiculturalidade e Consciência Global"},{"id":"A2.6","lvl":"A2","n":6,"name":"Planos e viagens","comp":"Falar sobre planos futuros, discutir uma viagem a trabalho ou lazer e relatar experiências de viagem a colegas.","gram":"be going to, future, linking words, simple past, want, will","vocab":"dates, holiday activities, time markers","prof":"Planejar viagens de negócios, discutir itinerários, falar sobre destinos futuros — tudo isso envolve o vocabulário e as estruturas deste tópico. Além disso, \"going to\" e futuro simples são as estruturas que o aluno usa para comunicar planos em reuniões: \"We're going to launch in Q3\" ou \"I'll send you the report by Friday.\"","hab":"Autogestão e Autodireção"},{"id":"A2.7","lvl":"A2","n":7,"name":"Comunicação no trabalho","comp":"Participar de reuniões simples e previsíveis, trocar informações por e-mail e lidar com ligações básicas no contexto profissional.","gram":"modals, wh-questions","vocab":"emails, meetings, phone calls","prof":"Este é provavelmente o tópico de maior aplicação imediata no A2: fazer pedidos, dar instruções, telefonar, escrever e-mails simples. O aluno que domina essas estruturas consegue funcionar em um ambiente de trabalho em inglês — mesmo sem fluência avançada.","hab":"Comunicação Eficaz"},{"id":"A2.8","lvl":"A2","n":8,"name":"Habilidades e desempenho","comp":"Descrever suas próprias habilidades e as de colegas, e expressar opiniões simples sobre pontos fortes e áreas de desenvolvimento.","gram":"Imperative, advice, can, modals","vocab":"personality, skills","prof":"Falar sobre o que sabe fazer bem, o que está desenvolvendo e o que ainda é desafiador é uma competência fundamental em avaliações de desempenho, entrevistas e conversas com gestores. \"I'm good at presenting, but I need to improve my writing\" é o tipo de frase que o aluno aprende a construir aqui.","hab":"Pensamento Crítico e Resolução de Problemas"},{"id":"A2.9","lvl":"A2","n":9,"name":"Negociações básicas","comp":"Comparar opções, discutir preços e condições simples e fazer ou responder a propostas elementares de negócio.","gram":"comparatives, first conditional, modals, offers, superlatives","vocab":"negotiations, prices, small talk","prof":"Propor, sugerir, concordar e discordar são as funções comunicativas deste tópico — e são exatamente as que aparecem em reuniões, negociações de prazo e acordos de projeto. Mesmo no A2, o aluno pode aprender a navegar essas trocas com clareza e educação.","hab":"Tomada de Decisão e Argumentação"},{"id":"A2.10","lvl":"A2","n":10,"name":"Networking e socialização profissional","comp":"Recepcionar visitantes, iniciar conversas em eventos de negócios e manter pequenas interações sociais em contexto profissional.","gram":"present perfect, present simple, simple past","vocab":"business entertainment, job, personal information, small talk","prof":"Participar de eventos de networking, conhecer pessoas novas em conferências, trocar cartões e manter contato são situações reais no mundo profissional. Este tópico prepara o aluno para ser um participante ativo — e não apenas um observador — em ambientes sociais de negócios.","hab":"Habilidades Sociais e Interpessoais"},{"id":"A2.11","lvl":"A2","n":11,"name":"Estilo e dress code","comp":"Descrever estilos de roupa, discutir dress code em contextos profissionais e expressar preferências pessoais de vestuário.","gram":"adjective order, comparatives, countable and uncountable nouns, likes and dislikes, quantifiers, superlatives","vocab":"accessories, clothes, clothing material, color, dress code","prof":"Dress code é uma conversa real em ambientes corporativos internacionais. Entender e respeitar o código de vestimenta de um cliente ou parceiro, ou orientar um visitante sobre o estilo do próprio escritório, são situações que exigem vocabulário específico e sensibilidade cultural.","hab":"Autoconsciência, Autogestão e Autodireção"},{"id":"A2.12","lvl":"A2","n":12,"name":"Receber e visitar","comp":"Receber pessoas em casa ou no ambiente de trabalho, sugerir programas e interagir em situações de hospitalidade pessoal e profissional.","gram":"be going to, gerund, if/wheter, present perfect, will, would like","vocab":"food and drink, free time activities, invitations, life events, sightseeing","prof":"Receber um cliente internacional no escritório, organizar uma visita, guiar alguém pelo espaço, oferecer hospitalidade — são situações de alta visibilidade profissional. O aluno que sabe fazer isso em inglês demonstra cuidado e competência ao mesmo tempo.","hab":"Habilidades Sociais e Interpessoais"},{"id":"B1.1","lvl":"B1","n":1,"name":"O Mundo do Trabalho","comp":"Communicar-se com autonomia em reuniões, negociações básicas e interações profissionais do dia a dia, relatando marcos da carreira e planos de projetos.","gram":"Imperative, future tenses, past modals, simple past","vocab":"interpersonal skills, personality","prof":"","hab":"Habilidades Sociais e Interpessoais"},{"id":"B1.2","lvl":"B1","n":2,"name":"Mídia e entretenimento","comp":"Falar sobre hábitos de consumo de mídia, expressar opiniões sobre programas e conteúdos e fazer recomendações a outras pessoas.","gram":"phrasal verbs, relative clauses","vocab":"TV programs, express preferences, make recommendations, media","prof":"","hab":"Habilidades Sociais e Interpessoais"},{"id":"B1.3","lvl":"B1","n":3,"name":"Estilo de vida e equilíbrio","comp":"Discutir hábitos de vida saudáveis, dar e receber conselhos sobre bem-estar e falar sobre o equilíbrio entre vida pessoal e profissional.","gram":"present perfect continuous, present perfect simple","vocab":"lifestyle, work-life balance","prof":"","hab":"Autocuidado e Bem-estar"},{"id":"B1.4","lvl":"B1","n":4,"name":"Educação e desenvolvimento","comp":"Descrever sua trajetória educacional, falar sobre experiências de aprendizagem e discutir planos de desenvolvimento profissional futuro.","gram":"future continuous, past habits","vocab":"academic year, educational issues, school life, stages of education","prof":"","hab":"Autodireção no Aprendizado"},{"id":"B1.5","lvl":"B1","n":5,"name":"Planos e aspirações","comp":"Expressar esperanças, ambições e planos para o futuro, usando estruturas condicionais e verbos de desejo para falar sobre possibilidades pessoais e profissionais.","gram":"1st conditional, future tenses, hope, wish, would like / love / hate","vocab":"dreams and ambitions","prof":"","hab":"Projeto de Vida"},{"id":"B1.6","lvl":"B1","n":6,"name":"Entrevista de emprego","comp":"Participar de uma entrevista de emprego, apresentar seu perfil profissional, responder perguntas sobre experiências passadas e expressar motivações e expectativas.","gram":"past continuous, present perfect simple, simple past, wh-questions","vocab":"job interview, jobs and companies, personality, resume","prof":"","hab":"Preparação Profissional"},{"id":"B1.7","lvl":"B1","n":7,"name":"Comunicação e influência","comp":"Discutir como a comunicação molda opiniões e comportamentos, falar sobre o papel da mídia e das redes sociais e expressar pontos de vista sobre mensagens persuasivas em contextos pessoais e profissionais.","gram":"comparative and superlative, reported speech","vocab":"communication styles, fake news and misinformation, media and press, persuasion and influence, public speaking, social media","prof":"","hab":"Pensamento Crítico e Consciência Míiática"},{"id":"B1.8","lvl":"B1","n":8,"name":"Relações interpessoais","comp":"Falar sobre diferentes tipos de relacionamentos (pessoais e profissionais), descrever dinâmicas interpessoais e discutir como as redes sociais influenciam as conexões humanas.","gram":"phrasal verbs, present continuous, present perfect simple","vocab":"dating apps, relationships","prof":"","hab":"Relacionamento Saudável"},{"id":"B1.9","lvl":"B1","n":9,"name":"Refeições e hospitalidade","comp":"Fazer pedidos, conduzir conversas educadas durante refeições de trabalho ou sociais e lidar com situações práticas em restaurantes.","gram":"comparative and superlative, would rather","vocab":"food and drink, restaurant, types of meals","prof":"","hab":"Etiqueta Social e Autonomia"},{"id":"B1.10","lvl":"B1","n":10,"name":"Negociações profissionais","comp":"Participar de negociações em contextos profissionais familiares, expressar posições, fazer concessões simples e buscar clareza quando necessário.","gram":"linking words of cause and effect, suggestions","vocab":"collocations, interpersonal skills, negotiating expressions","prof":"","hab":"Colaboração e Resolução de Conflitos"},{"id":"B1.11","lvl":"B1","n":11,"name":"Segurança no trabalho","comp":"Discutir normas de segurança no ambiente de trabalho, relatar acidentes ou lesões e explicar regras e procedimentos usando a voz passiva.","gram":"passive voice","vocab":"injuries, processes","prof":"","hab":"Consciência e Prevenção de Riscos"},{"id":"B1.12","lvl":"B1","n":12,"name":"Ética e conduta profissional","comp":"Discutir padrões de comportamento e conduta no ambiente profissional, expressar opiniões sobre dilemas éticos e reagir adequadamente a situações de conflito.","gram":"past modals, second conditional, speculation","vocab":"behavior, crime and punishment, ethics and conduct, morality","prof":"","hab":"Convivência Respeitosa e Ética Profissional"},{"id":"B2.1","lvl":"B2","n":1,"name":"Diplomacia Corporativa","comp":"Argumentar com segurança sobre temas profissionais e sociais complexos, justificando opiniões e gerindo situações imprevistas.","gram":"inversion for emphasis, mixed conditionals, modal verbs of speculation, passive voice","vocab":"business communication, formal vs informal register, idiomatic expressions, workplace ethics","prof":"","hab":"Comunicação Assertiva e Resolução de Problemas"},{"id":"B2.2","lvl":"B2","n":2,"name":"Finanças e orçamento","comp":"Falar sobre finanças pessoais e profissionais, interpretar informações financeiras básicas e dar e receber conselhos sobre gestão de recursos.","gram":"mixed tenses, past perfect, present perfect simple, suggestions","vocab":"collocations, finances, giving opinions, idioms, money","prof":"","hab":"Educação Financeira e Autonomia"},{"id":"B2.3","lvl":"B2","n":3,"name":"Bem-estar e produtividade","comp":"Analisar a relação entre bem-estar físico e mental e desempenho profissional, discutir estratégias de produtividade e argumentar sobre práticas saudáveis no trabalho.","gram":"Modals of Deduction and Speculation, advice, linking words, mixed tenses, past tenses, phrasal verbs","vocab":"health and well being, health problems","prof":"","hab":"Equilíbrio e Qualidade de Vida"},{"id":"B2.4","lvl":"B2","n":4,"name":"Trajetória e desenvolvimento de carreira","comp":"Apresentar sua trajetória profissional com detalhes, analisar suas competências e pontos de desenvolvimento e articular um plano de carreira de forma estruturada.","gram":"future continuous, future tenses, likelihood","vocab":"career, educational issues, hard skills, idioms, job titles, phrasal verbs about plans, soft skills","prof":"","hab":"Autoconhecimento e Planejamento de Carreira"},{"id":"B2.5","lvl":"B2","n":5,"name":"Processos mentais e eficácia","comp":"Discutir como processos cognitivos e modelos mentais influenciam a tomada de decisão e a produtividade, e aplicar esse vocabulário em contextos de gestão e liderança.","gram":"future perfect, future tenses, likelihood","vocab":"Expressing certainty probability doubt, mental processes, productivity, project management","prof":"","hab":"Autogestão Cognitiva"},{"id":"B2.6","lvl":"B2","n":6,"name":"Reuniões profissionais","comp":"Participar e conduzir reuniões em contextos profissionais, expressar opiniões e discordâncias de forma clara, fazer sugestões e elaborar sínteses e encaminhamentos.","gram":"linking words of cause and effect, passive voice, suggestions","vocab":"agreement and disagreement, chairing a meeting, giving opinions, meeting reports","prof":"","hab":"Colaboração Profissional"},{"id":"B2.7","lvl":"B2","n":7,"name":"Pensamento crítico e argumentação","comp":"Construir e defender argumentos com base em evidências, analisar pontos de vista divergentes e expressar posições de forma estruturada e persuasiva em contextos profissionais.","gram":"advice, linking words","vocab":"book genres, book review, express preferences, reading, technical devices","prof":"","hab":"Pensamento Crítico e Argumentação"},{"id":"B2.8","lvl":"B2","n":8,"name":"Interações sociais no trabalho","comp":"Usar registros linguísticos adequados a diferentes situações sociais e profissionais, incluindo elogios, expressão de simpatia e conversas informais em contextos corporativos.","gram":"phrasal verbs, verb + verb combinations","vocab":"Interacting informally reacting expressing interest sympathy surprise, politeness/impoliteness, texting language","prof":"","hab":"Inteligência Social"},{"id":"B2.9","lvl":"B2","n":9,"name":"Liderança e gestão de pessoas","comp":"Analisar diferentes estilos de liderança, discutir o que caracteriza líderes eficazes e refletir sobre o próprio papel em contextos de liderança ou trabalho em equipe.","gram":"Question tags, word formation","vocab":"agreement and disagreement, biographies, personality","prof":"","hab":"Mentalidade de Liderança"},{"id":"B2.10","lvl":"B2","n":10,"name":"Tendências globais e futuro do trabalho","comp":"Discutir tendências que estão moldando o mercado de trabalho, como automação e globalização, e expressar e defender pontos de vista com argumentação estruturada.","gram":"mixed conditionals, passives, relative clauses, reported speech","vocab":"agreement and disagreement, behavior, corruption, develop an argument, election, government, politics","prof":"","hab":"Consciência Global e Pensamento Prospectivo"},{"id":"B2.11","lvl":"B2","n":11,"name":"Imprevistos e resolução de problemas","comp":"Lidar com situações inesperadas e complexas em contextos profissionais, narrar o que aconteceu, expressar desculpas ou explicações e propor soluções de forma articulada.","gram":"narrative tenses, past possibilities, speculation","vocab":"meetings, mishaps, problems at work, technical difficulties","prof":"","hab":"Autogestão Emocional"},{"id":"B2.12","lvl":"B2","n":12,"name":"Comunicação intercultural nos negócios","comp":"Discutir diferenças culturais com sensibilidade, adaptar o estilo de comunicação a diferentes contextos internacionais e demonstrar consciência intercultural em situações profissionais.","gram":"adverbs, comparative and superlative, descriptive adjectives, past modals","vocab":"art and city's cultural life, celebration, countries, different spelling","prof":"","hab":"Consciência Intercultural"},{"id":"B2+.1","lvl":"B2+","n":1,"name":"Decisões","comp":"Analisar contextos multifacetados, defender pontos de vista complexos com fluidez e sintetizar informações abstratas para propor soluções estratégicas.","gram":"linking words, narrative tenses, past possibilities, reported speech","vocab":"Expressing certainty probability doubt, develop an argument, giving opinions, personality","prof":"","hab":"Pensamento Crítico Avançado"},{"id":"B2+.2","lvl":"B2+","n":2,"name":"Compliance e ética nos negócios","comp":"Discutir normas, regulamentos e dilemas éticos no ambiente corporativo, apresentar evidências e analisar causas e consequências de decisões empresariais.","gram":"conditional sentences, discussing cause and effect, presenting evidence and supporting claim","vocab":"court, ,"name":"Tecnologia e transformação digital","comp":"Discutir o impacto de tecnologias emergentes no mundo do trabalho, expressar opiniões fundamentadas sobre IA, privacidade digital e transformação organizacional.","gram":"passives, prediction and speculation","vocab":"artificial intelligence, cybersecurity and online privacy, metaverse, texting language","prof":"","hab":"Análise Crítica da Tecnologia"},{"id":"B2+.8","lvl":"B2+","n":8,"name":"Saúde mental no trabalho","comp":"Discutir saúde mental e bem-estar no ambiente profissional, identificar sinais de esgotamento e estresse e argumentar sobre o papel das organizações na promoção de ambientes saudáveis.","gram":"phrasal verbs, relative clauses","vocab":"burnout, peer pressure, stress and anxiety management","prof":"","hab":"Cuidar do Bem-Estar Mental"},{"id":"B2+.9","lvl":"B2+","n":9,"name":"Comunicação estratégica","comp":"Aplicar estratégias de comunicação clara, concisa e persuasiva em contextos profissionais de alta exigência, incluindo negociações, apresentações e situações de conflito.","gram":"discourse markers, idiomatic expressions, verb tenses","vocab":"active listening, asking for clarification, communication strategies","prof":"","hab":"Comunicar com Clareza e Persuasão"},{"id":"B2+.10","lvl":"B2+","n":10,"name":"Criatividade e inovação","comp":"Discutir processos criativos, explorar conexões entre cultura, arte e inovação no ambiente profissional e argumentar sobre o papel da criatividade na solução de problemas.","gram":"descriptive adjectives, mixed conditionals","vocab":"computer games, music concerts, streaming services, theaters and plays","prof":"","hab":"Pensamento Criativo e Inovador"},{"id":"B2+.11","lvl":"B2+","n":11,"name":"Relacionamento com clientes e stakeholders","comp":"Construir e manter relacionamentos profissionais com clientes e partes interessadas, gerenciar expectativas, lidar com situações delicadas e comunicar-se com tato e assertividade.","gram":"phrasal verbs, prepositions of place, verb + verb combinations","vocab":"networking, small talk, team work","prof":"","hab":"Construir Relações Profissionais Positivas"},{"id":"B2+.12","lvl":"B2+","n":12,"name":"Pitch e defesa de ideias","comp":"Apresentar e defender projetos e ideias de forma persuasiva, responder a objeções com segurança e adaptar o discurso ao perfil e às expectativas do interlocutor.","gram":"","vocab":"","prof":"","hab":"Apresentar Ideias com Clareza e Confiança"},{"id":"C1.1","lvl":"C1","n":1,"name":"Negociação & Gestão de Crises","comp":"Expressar-se de forma fluida, espontânea e estruturada sobre temas complexos de relevância global, demonstrando controle sobre nuances de significado e capacidade de sintetizar múltiplas perspectivas.","gram":"discourse markers, passives","vocab":"collocations, idiomatic expressions","prof":"","hab":"Pensamento Crítico Global e Articulação Complexa"},{"id":"C1.2","lvl":"C1","n":2,"name":"Sucesso, fracasso e aprendizagem","comp":"Discutir com profundidade diferentes concepções de sucesso, analisar o papel do fracasso no desenvolvimento profissional e explorar como líderes constroem equipes de alto desempenho.","gram":"linking words, past tenses","vocab":"collocations, hard skills, idiomatic expressions, idioms, interpersonal skills, success and failure","prof":"","hab":"Construir Caminhos Sustentáveis para o Sucesso"},{"id":"C1.3","lvl":"C1","n":3,"name":"Qualidade de vida e longevidade","comp":"Analisar fatores que determinam qualidade de vida e longevidade, discutir a psicologia do bem-estar e explorar o impacto das escolhas de vida no desempenho profissional sustentável.","gram":"","vocab":"health & well-being, idiomatic expressions, lifestyle, longevity, psychology, work-life balance","prof":"","hab":"Promover Equilíbrio e Bem-Estar Sustentável"},{"id":"C1.4","lvl":"C1","n":4,"name":"Responsabilidade social e impacto corporativo","comp":"Analisar problemas sociais contemporâneos e o papel das empresas na sua mitigação, articular posições sobre responsabilidade corporativa e discutir modelos de negócio com impacto social positivo.","gram":"connectors","vocab":"economy, human rights, immigration, social issues, society, war and conflicts","prof":"","hab":"Consciência Social e Corporativa"},{"id":"C1.5","lvl":"C1","n":5,"name":"Crise climática e estratégia empresarial","comp":"Debater a crise climática como desafio estratégico para empresas e governos, analisar trade-offs entre crescimento econômico e sustentabilidade e participar de discussões sobre políticas ambientais com posicionamento fundamentado.","gram":"future tenses, linking words of cause and effect, mixed conditionals, passive voice","vocab":"climate, environment, food, nature, pollution, sustainability","prof":"","hab":"Consciência Ambiental Estratégica"},{"id":"C1.6","lvl":"C1","n":6,"name":"Mídia, narrativa e opinião pública","comp":"Analisar criticamente como a mídia constrói narrativas, discutir o impacto da informação e da desinformação na opinião pública e defender pontos de vista com argumentação sofisticada e uso de linguagem persuasiva.","gram":"Markers to structure and signpost, passives, reported speech","vocab":"Breaking news, Critiquing and reviewing, Defending a point of view persuasively, Media idioms, The Media","prof":"","hab":"Pensamento Crítico Míiático"},{"id":"C1.7","lvl":"C1","n":7,"name":"Gestão de riscos e tomada de decisão","comp":"Analisar e discutir riscos em contextos profissionais e pessoais, estruturar argumentos sobre trade-offs e incertezas e expressar posições nuançadas sobre decisões em ambientes de alta complexidade.","gram":"Futures (revision), Inversion, Linking: contrast and concession","vocab":"Expressing attitudes and feelings precisely, Extreme sports, Giving advice, Intentions and arrangements, Tricky situations, personality","prof":"","hab":"Tomada de Decisão Consciente"},{"id":"C1.8","lvl":"C1","n":8,"name":"Futuro da educação e aprendizagem contínua","comp":"Debater o futuro dos sistemas educacionais, analisar modelos de aprendizagem contínua no contexto corporativo e discutir o impacto da tecnologia na formação de profissionais.","gram":"","vocab":"education idioms, education system, online education, school life, society and change, teaching and learning","prof":"","hab":"Autodireção no Aprendizado"},{"id":"C1.9","lvl":"C1","n":9,"name":"Humor e inteligência social","comp":"Discutir o papel do humor na comunicação interpessoal e na liderança, analisar diferenças culturais no uso do humor e navegar com sofisticação os limites do humor em contextos profissionais.","gram":"collocations, phrasal verbs","vocab":"Expressing attitudes and feelings precisely, idiomatic expressions, jokes and puns, types of humor","prof":"","hab":"Usar o Humor com Inteligência"},{"id":"C1.10","lvl":"C1","n":10,"name":"Domínio de registro e comunicação intercultural","comp":"Transitar com fluidez entre diferentes registros e estilos comunicativos, adaptar a linguagem a interlocutores e contextos diversos e navegar com sofisticação as nuances da comunicação intercultural em ambientes profissionais.","gram":"","vocab":"communication problems, communication skills, cultural differences, diplomatic language, gesture, idiomatic expressions, register, slang","prof":"","hab":"Adaptar a Comunicação ao Contexto"},{"id":"C1.11","lvl":"C1","n":11,"name":"Ética aplicada e dilemas profissionais","comp":"Analisar dilemas éticos complexos em contextos profissionais, discutir a tensão entre interesses corporativos e valores individuais e articular posições fundamentadas sobre questões de ética empresarial e direitos humanos.","gram":"","vocab":"business ethics, ethical dilemmas, ethics and conduct, human rights, war and conflicts","prof":"","hab":"Refletir e Argumentar com Base em Valores Éticos"},{"id":"C1.12","lvl":"C1","n":12,"name":"Gestão de conflitos e feedback","comp":"Identificar e navegar conflitos interpessoais em contextos profissionais, dar e receber feedback com assertividade e empatia e desenvolver estratégias para a resolução construtiva de desentendimentos em equipes.","gram":"Ellipsis and substitution, Simple and continuous verbs, participle clauses","vocab":"Adjectives: Describing buildings, Adjectives: Describing images, Architecture, Arts, Emphasizing a point feeling issue","prof":"","hab":"Resolução Construtiva de Conflitos"},{"id":"C1.13","lvl":"C1","n":13,"name":"Governança tecnológica e ética digital","comp":"Debater as implicações éticas, sociais e políticas das tecnologias emergentes, analisar questões de governança de IA e privacidade digital e especular com sofisticação sobre futuros tecnológicos e seus impactos.","gram":"Modals of Deduction and Speculation, phrasal verbs","vocab":"artificial intelligence","prof":"","hab":"Pensamento Crítico sobre Tecnologia"},{"id":"C1.14","lvl":"C1","n":14,"name":"Economia e mercados globais","comp":"Analisar dinâmicas de mercados globais, discutir conceitos econômicos essenciais como inflação, política monetária e cadeias de suprimento e relacionar tendências macroeconômicas ao contexto dos próprios negócios.","gram":"comparisons, past perfect","vocab":"travel idioms","prof":"","hab":"Consciência Econômica Global"},{"id":"C1.15","lvl":"C1","n":15,"name":"Neurociência e performance profissional","comp":"Analisar como fatores físicos e mentais influenciam a performance profissional, discutir achados da neurociência aplicados ao trabalho e argumentar sobre o papel das organizações na promoção de saúde integral.","gram":"gerund, infinitive","vocab":"expressions with\"get\", health and well being","prof":"","hab":"Bem-Estar Integral e Performance"},{"id":"C1.16","lvl":"C1","n":16,"name":"Criatividade, design e inovação","comp":"Explorar a relação entre criatividade, design e inovação no mundo dos negócios, discutir como a estética e o pensamento criativo influenciam produtos, marcas e liderança e expressar análises com vocabulário descritivo sofisticado.","gram":"countable/uncountable nouns, modal verbs","vocab":"food idioms","prof":"","hab":"Pensamento Criativo e Estético"},{"id":"C1.17","lvl":"C1","n":17,"name":"Diversidade, equidade e inclusão","comp":"Analisar estruturas de exclusão e desigualdade em contextos sociais e corporativos, debater políticas de diversidade e equidade e articular posições fundamentadas sobre inclusão com sensibilidade e precisão.","gram":"discourse markers","vocab":"discrimination, identity","prof":"","hab":"Inclusão e Consciência Social"},{"id":"C1.18","lvl":"C1","n":18,"name":"Plataformas digitais e identidade profissional","comp":"Analisar o poder das plataformas digitais sobre comportamento e opinião, discutir a construção de identidade e reputação profissional online e debater os limites éticos da presença digital.","gram":"expressions of opinion","vocab":"digital footprint, influencers","prof":"","hab":"Consciência Digital e Reputação"},{"id":"C1+.1","lvl":"C1+","n":1,"name":"Narrativa e storytelling profissional","comp":"Analisar como narrativas constroem sentido e influenciam audiências, e aplicar princípios de storytelling na comunicação corporativa e na liderança.","gram":"describing plots, sequencing expressions","vocab":"movies genres","prof":"","hab":"Comunicação Narrativa"},{"id":"C1+.2","lvl":"C1+","n":2,"name":"Cultura, identidade e expressão artística","comp":"Analisar como manifestações culturais e artísticas refletem e moldam identidades sociais e profissionais, e discutir com sofisticação o papel da cultura na construção de ambientes organizacionais.","gram":"comparative and superlative","vocab":"adjectives of feelings, music idioms","prof":"","hab":"Expressão Cultural e Identidade"},{"id":"C1+.3","lvl":"C1+","n":3,"name":"Economia comportamental e decisão","comp":"Discutir como viéses cognitivos e fatores psicológicos influenciam decisões econômicas e de negócio, e aplicar conceitos de economia comportamental à análise de contextos profissionais.","gram":"causative form","vocab":"economy, financial terms","prof":"","hab":"Consciência dos Viéses Cognitivos"},{"id":"C1+.4","lvl":"C1+","n":4,"name":"História, padrões e lições para o presente","comp":"Analisar eventos históricos como sistemas de causa e consequência, identificar padrões que se repetem e articular conexões entre o passado e desafios contemporâneos no mundo dos negócios e da sociedade.","gram":"past narrative tenses","vocab":"historical vocabulary","prof":"","hab":"Consciência Histórica Aplicada"},{"id":"C1+.5","lvl":"C1+","n":5,"name":"Liderança em contextos de mudança e crise","comp":"Analisar como líderes navegam crises e processos de mudança organizacional, discutir o papel do líder como agente de transformação cultural e articular uma visão própria de liderança com sofisticação e nuance.","gram":"noun phrases, reporting verbs","vocab":"leadership vocabulary","prof":"","hab":"Liderança Consciente e Adaptativa"},{"id":"C1+.6","lvl":"C1+","n":6,"name":"Imagem, marca pessoal e presença executiva","comp":"Discutir como imagem, estilo e presença comunicativa constroem autoridade e credibilidade profissional, analisar a relação entre identidade pessoal e marca profissional e explorar como culturas organizacionais expressam valores através da aparência e do comportamento.","gram":"expressions of opinion, passive voice","vocab":"fashion idioms","prof":"","hab":"Construção de Autoridade e Credibilidade"},{"id":"C1+.7","lvl":"C1+","n":7,"name":"Alta performance e mentalidade de campeão","comp":"Explorar conceitos de alta performance no esporte e suas aplicações no ambiente profissional, discutir mentalidade, resiliência e trabalho em equipe a partir de casos e metáforas do mundo esportivo.","gram":"modals of advice/necessity","vocab":"sports idioms","prof":"","hab":"Mentalidade de Alta Performance"},{"id":"C1+.8","lvl":"C1+","n":8,"name":"Capital social e redes de influência","comp":"Analisar como redes de relacionamento constroem capital social e influência no mundo profissional, discutir a dinâmica de confiança e reciprocidade em contextos organizacionais e explorar estratégias de construção de redes com propósito.","gram":"mixed conditionals","vocab":"interpersonal expressions","prof":"","hab":"Construção de Redes com Propósito"},{"id":"C1+.9","lvl":"C1+","n":9,"name":"Liderança cívica e responsabilidade social","comp":"Discutir o papel do profissional como cidadão ativo e agente de mudança, analisar como empresas e indivíduos podem contribuir para políticas públicas mais eficazes e articular uma visão de responsabilidade cívica com registro formal sofisticado.","gram":"formal register","vocab":"activism, rights and duties","prof":"","hab":"Cidadania Ativa e Liderança"},{"id":"C1+.10","lvl":"C1+","n":10,"name":"Empreendedorismo e inovação disruptiva","comp":"Analisar ecossistemas de inovação e modelos de negócio disruptivos, discutir o papel do empreendedor como agente de mudança e articular visões sobre o futuro das organizações com sofisticação e fundamentação.","gram":"future tenses","vocab":"business terms","prof":"","hab":"Inovação e Pensamento Empreendedor"},{"id":"C1+.11","lvl":"C1+","n":11,"name":"Complexidade global e pensamento sistêmico","comp":"Analisar desafios globais complexos como sistemas interdependentes, discutir causas estruturais e soluções sistêmicas e articular posições sofisticadas sobre a responsabilidade coletiva diante de crises globais.","gram":"modal verbs for obligation/probality","vocab":"global issues","prof":"","hab":"Consciência Global e Pensamento Sistêmico"},{"id":"C1+.12","lvl":"C1+","n":12,"name":"Literatura, ficção e inteligência contextual","comp":"Analisar narrativas literárias como janelas para a compreensão humana, discutir como a ficção desenvolve empatia e leitura de contexto e explorar conexões entre pensamento literário e tomada de decisão profissional.","gram":"indirect speech, narrative tenses","vocab":"literay terms","prof":"","hab":"Leitura Crítica e Empatia"},{"id":"C1+.13","lvl":"C1+","n":13,"name":"Psicologia organizacional e comportamento coletivo","comp":"Analisar como dinâmicas psicológicas influenciam comportamentos em equipes e organizações, discutir viéses cognitivos e emocionais no ambiente de trabalho e aplicar conceitos de psicologia à liderança e à gestão de pessoas.","gram":"participle clauses","vocab":"feelings, psychological terms","prof":"","hab":"Inteligência Emocional Organizacional"},{"id":"C1+.14","lvl":"C1+","n":14,"name":"Economia circular e sistemas sustentáveis","comp":"Analisar modelos de economia circular e sistemas de produção sustentável, discutir transições energéticas e seus impactos econômicos e sociais e articular visões sobre o papel das empresas na construção de futuros mais sustentáveis.","gram":"present perfect continuous","vocab":"environment","prof":"","hab":"Consciência Sustentável Sistêmica"},{"id":"C1+.15","lvl":"C1+","n":15,"name":"Inovação, adoção e difusão de ideias","comp":"Analisar como inovações surgem e se difundem em sociedades e organizações, discutir os fatores que determinam o sucesso ou fracasso de novas ideias e explorar o papel da liderança na criação de culturas de inovação.","gram":"passives, sequencing adverbs","vocab":"innovation","prof":"","hab":"Mentalidade Inovadora"},{"id":"C1+.16","lvl":"C1+","n":16,"name":"Justiça, direito e ética institucional","comp":"Discutir conceitos de justiça e sua aplicação em contextos institucionais e corporativos, analisar tensões entre lei, ética e interesse público e articular posições fundamentadas sobre direitos humanos e responsabilidade institucional.","gram":"conditionals, reported questions","vocab":"legal terms","prof":"","hab":"Consciência Cívica e Ética Institucional"},{"id":"C1+.17","lvl":"C1+","n":17,"name":"Mobilidade humana e diversidade de talentos","comp":"Analisar as causas e consequências dos fluxos migratórios globais, discutir o impacto da diversidade cultural nas organizações e articular posições sobre políticas de integração e aproveitamento de talentos internacionais.","gram":"cause-effect, verb patterns","vocab":"immigration","prof":"","hab":"Consciência Global e Diversidade — analisar causas e consequências dos fluxos migratórios e discutir o impacto da diversidade cultural nas organizações"},{"id":"C1+.18","lvl":"C1+","n":18,"name":"Pensamento prospectivo e cenários futuros","comp":"Construir e articular cenários futuros com sofisticação, discutir tendências de longo prazo que afetam o planeta, a humanidade e o mundo do trabalho e especular com precisão e criatividade sobre futuros alternativos.","gram":"future perfect, hypothetical scenarios","vocab":"idioms of speculation","prof":"","hab":"Visão Prospectiva e Criatividade — construir e articular cenários futuros com sofisticação, especulando com precisão sobre futuros alternativos para o planeta, a humanidade e o trabalho"}]</script>

<script>/* ===== Adaptador Netlify: substitui as capacidades do claude.ai por chamadas à /api ===== */
(() => {
  const KEY = 'ccli-rel-chave';
  const getK = () => { try { return localStorage.getItem(KEY) || ''; } catch { return window.__k || ''; } };
  const setK = v => { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch {} window.__k = v; };
  const err = (code, message) => Object.assign(new Error(message || code), {code});
  async function api(path, opts = {}) {
    const r = await fetch(path, {...opts, headers: {'content-type': 'application/json', 'x-chave': getK(), ...(opts.headers || {})}});
    if (r.status === 401) { setK(''); location.reload(); throw err('unavailable'); }
    if (r.status === 403) throw err('invalid_argument', 'sem permissão');
    if (!r.ok) throw err('unavailable', 'HTTP ' + r.status);
    return r.json();
  }
  const snap = (id, v) => ({id, exists: v !== undefined && v !== null, data: () => v, metadata: {fromCache: false, hasPendingWrites: false}});
  const db = {
    doc: p => ({path: p, id: p.split('/').pop(),
      get: async () => { const r = await api('/api/doc?p=' + encodeURIComponent(p)); return snap(p.split('/').pop(), r.data); },
      set: async v => { await api('/api/doc?p=' + encodeURIComponent(p), {method: 'PUT', body: JSON.stringify(v)}); },
      delete: async () => { await api('/api/doc?p=' + encodeURIComponent(p), {method: 'DELETE'}); },
      onSnapshot(fn) { let last = null; const tick = async () => { try { const s = await this.get(); const j = JSON.stringify(s.data() ?? null); if (j !== last) { if (last !== null) fn(s); last = j; } } catch {} }; tick(); const t = setInterval(tick, 120000); return () => clearInterval(t); }}),
    collection: c => ({path: c, onSnapshot(fn) { const tick = async () => { try { const m = await api('/api/lista?prefix=' + encodeURIComponent(c + '/')); fn({docs: Object.entries(m).map(([id, v]) => snap(id, v)), size: Object.keys(m).length, empty: !Object.keys(m).length}); } catch {} }; tick(); const t = setInterval(tick, 90000); return () => clearInterval(t); }}),
  };
  let papel = null, ia = false;
  const user = {canEdit: async () => papel === 'admin', isOwner: () => papel === 'admin'};
  const sample = async () => { throw err('unavailable'); };
  sample.json = async (prompt) => {
    const job = 'j-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
    const r = await fetch('/api/redigir', {method: 'POST', headers: {'content-type': 'application/json', 'x-chave': getK()}, body: JSON.stringify({job, prompt})});
    if (r.status !== 202 && !r.ok) throw err('unavailable');
    const t0 = Date.now();
    while (Date.now() - t0 < 5 * 60 * 1000) {
      await new Promise(res => setTimeout(res, 3000));
      const s = await api('/api/job?id=' + job).catch(() => null);
      if (s && s.status === 'pronto') return s.data;
      if (s && s.status === 'erro') { console.warn('redigir:', s.erro); throw err(/json/i.test(s.erro) ? 'invalid_json' : 'unavailable', s.erro); }
    }
    throw err('unavailable', 'tempo esgotado');
  };
  const downloads = {save: async ({filename, data}) => {
    const blob = data instanceof Blob ? data : new Blob([data], {type: /\.html$/.test(filename) ? 'text/html' : 'application/octet-stream'});
    const u = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = u; a.download = filename; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000);
    return {status: 'saved'};

  const caps = {db, user, sample, downloads};
  let pronto;
  const ready = new Promise(r => { pronto = r; });
  window.claude = {use: async n => { await ready; if (n === 'sample' && !ia) return null; return caps[n] || null; }};
  window.__sair = () => { setK(''); location.reload(); };

  async function check() {
    if (!getK()) return false;
    try { const r = await fetch('/api/quemsou', {headers: {'x-chave': getK()}}); if (!r.ok) return false; const j = await r.json(); papel = j.papel; ia = !!j.ia; return true; } catch { return false; }
  }
  function login(msg) {
    const box = document.createElement('div');
    box.id = 'login';
    box.innerHTML = `<form class="panel" style="max-width:380px;margin:12vh auto;display:grid;gap:12px">
      <h2 style="font-family:var(--f-disp);margin:0;font-size:19px">Acesso ao painel</h2>
      <p class="muted small" style="margin:0">Digite a chave de acesso enviada pela equipe de Sucesso do Cliente.</p>
      <input type="password" id="login-k" autocomplete="current-password" placeholder="Chave de acesso" required>
      ${msg ? `<p class="small" style="margin:0;color:var(--bad)">${msg}</p>` : ''}
      <button class="btn pri" type="submit">Entrar</button></form>`;
    document.querySelector('main').prepend(box);
    document.getElementById('view').hidden = true;
    box.querySelector('form').addEventListener('submit', async e => {
      e.preventDefault(); setK(box.querySelector('#login-k').value.trim());
      if (await check()) { box.remove(); document.getElementById('view').hidden = false; pronto(); }
      else { box.remove(); login('Chave não reconhecida. Confira e tente de novo.'); }
    });
    box.querySelector('#login-k').focus();
  }
  document.addEventListener('DOMContentLoaded', async () => { if (await check()) pronto(); else login(''); });
})();
