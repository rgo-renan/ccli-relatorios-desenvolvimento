<script>/* ===== Motor de dados · Gerador de relatórios CCLi ===== */
const ENG = (() => {
  const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const MES_LONGO = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const INSIGNA = ['baker hughes','ge do brasil','adyen','sandoz','dow','novartis','siemens','westrock','indorama','insigna'];
  const LV = ['A1','A2','B1','B2','B2+','C1','C1+','C2'];
  const LV_DESC = {A1:'nível inicial',A2:'nível básico avançado',B1:'nível intermediário',B2:'nível intermediário avançado','B2+':'nível intermediário superior',C1:'nível avançado','C1+':'nível avançado superior',C2:'nível de proficiência'};

  const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()
      .replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
  const slug = s => norm(s).replace(/ /g,'-').slice(0,120) || 'x';
  const toks = s => norm(s).split(' ').filter(t => t.length > 1 && !['de','da','do','das','dos','e'].includes(t));

  // Excel serial / string / Date -> 'YYYY-MM-DD' | null
  function isoDate(v, XLSX) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') {
      if (v < 20000 || v > 80000) return null;
      const d = XLSX.SSF.parse_date_code(v);
      return d ? `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}` : null;
    }
    if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
    const s = String(v).trim();
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return +m[1] > 2100 ? null : `${m[1]}-${m[2]}-${m[3]}`;
    m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    return null;
  }
  const num = v => { if (v == null || v === '') return 0; const n = typeof v === 'number' ? v : parseFloat(String(v).replace('%','').replace(',','.')); return isNaN(n) ? 0 : n; };

  function rowsOf(ws, XLSX) { return XLSX.utils.sheet_to_json(ws, {defval: null, raw: true}); }
  function col(row, ...names) {
    const keys = Object.keys(row);
    for (const n of names) { const k = keys.find(k => norm(k) === norm(n)); if (k) return row[k]; }
    for (const n of names) { const k = keys.find(k => norm(k).startsWith(norm(n))); if (k) return row[k]; }
    return null;
  }

  /* ---------- Gestão Geral ---------- */
  function segmentoDe(empresa) {
    const e = norm(empresa);
    if (!e) return 'Proprietário';
    if (/\bge\b/.test(e) && (e === 'ge' || e.startsWith('ge do brasil') || e.startsWith('ge '))) return 'Insigna';
    return INSIGNA.some(x => e.includes(x)) ? 'Insigna' : 'Proprietário';
  }
  function parseGestao(wb, XLSX) {
    const name = wb.SheetNames.find(n => norm(n) === 'alunos') || wb.SheetNames[0];
    const rows = rowsOf(wb.Sheets[name], XLSX);
    if (!rows.length || col(rows[0],'Nome') === undefined) throw new Error('Não encontrei a coluna "Nome" na aba Alunos.');
    const out = [];
    for (const r of rows) {
      const nome = String(col(r,'Nome') ?? '').replace(/\s+/g,' ').trim();
      if (!nome) continue;
      const empresa = String(col(r,'Empresa (antigo)','Empresa') ?? '').trim();
      const vinc = String(col(r,'Vínculo','Contrato') ?? '').trim();
      out.push({
        n: nome, st: String(col(r,'Status') ?? '').trim(),
        c: String(col(r,'Consultores','Consultor') ?? '').trim(),
        md: String(col(r,'Modalidade') ?? '').trim(),
        vi: vinc, rf: String(col(r,'Resp. Fin.','RespFinanc') ?? '').trim(),
        emp: empresa,
        ini: isoDate(col(r,'Início'), XLSX), ter: isoDate(col(r,'Término'), XLSX),
        id: String(col(r,'Idioma') ?? '').trim(), nv: String(col(r,'Nível') ?? '').trim(),
        ltv: num(col(r,'LTV')), sg: segmentoDe(empresa),
      });
    }
    return out;
  }

  /* ---------- Frequência ---------- */
  const MES_RX = /^(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-z]*\s*[-/ ]?\s*(\d{2,4})/i;
  function sheetMonth(n) {
    const m = norm(n).match(MES_RX); if (!m) return null;
    let y = +m[2]; if (y < 100) y += 2000;
    return `${y}-${String(MES.indexOf(m[1].slice(0,3)) + 1).padStart(2,'0')}`;
  }
  function parseFreq(wb, XLSX) {
    const data = {}; const meses = [];
    for (const sn of wb.SheetNames) {
      const ym = sheetMonth(sn); if (!ym) continue;
      meses.push(ym);
      for (const r of rowsOf(wb.Sheets[sn], XLSX)) {
        const nome = String(col(r,'Aluno','Nome') ?? '').replace(/\s+/g,' ').trim(); if (!nome) continue;
        const p = num(col(r,'Presentes')), f = num(col(r,'Faltas'));
        const k = norm(nome);
        (data[k] ||= {n: nome, m: {}});
        const prev = data[k].m[ym] || [0,0];
        data[k].m[ym] = [prev[0] + p, prev[1] + f];
      }
    }
    if (!meses.length) throw new Error('Nenhuma aba de mês reconhecida (ex.: Jan26, Fev26).');
    meses.sort();
    return {meses: [...new Set(meses)], alunos: data};
  }

  /* ---------- Forms consultor ---------- */
  const FQ = {
    reg: 'O aluno tem comparecido', avisa: 'Se houver ausências', part: 'Como você descreveria a participação',
    int: 'O aluno demonstra interesse', ativ: 'O aluno realiza as atividades', acomp: 'O aluno consegue acompanhar',
    ritmo: 'O ritmo de evolução', motiv: 'Como você avalia o estado motivacional', naoEvol: 'O aluno já expressou',
    ctx: 'Há algum contexto', risco: 'Na sua percepção', rec: 'O que você recomendaria',
  };
  function parseForms(wb, XLSX) {
    const rows = rowsOf(wb.Sheets[wb.SheetNames[0]], XLSX);
    const out = [];
    for (const r of rows) {
      const keys = Object.keys(r);
      const nome = String(col(r,'Nome do aluno') ?? '').replace(/\s+/g,' ').replace(/[.;,]+$/,'').trim();
      if (!nome) continue;
      const ts = isoDate(r[keys[0]], XLSX);
      const dp = isoDate(col(r,'Data de preenchimento'), XLSX);
      const dt = (dp && dp >= '2024-01-01' && (!ts || dp <= ts)) ? dp : (ts || dp);
      const o = {n: nome, cons: String(col(r,'Consultor responsável') ?? '').trim(), dt};
      for (const [k, q] of Object.entries(FQ)) {
        const kk = keys.find(x => norm(x).startsWith(norm(q)));
        o[k] = kk ? String(r[kk] ?? '').trim() : '';
      }
      out.push(o);
    }
    return out;
  }

  /* ---------- Matching ---------- */
  function buildMatcher(names) { // names: array of normalized keys
    const exact = new Set(names), fl = {}, ft = {};
    for (const k of names) {
      const t = k.split(' ').filter(x => !['de','da','do','das','dos','e'].includes(x));
      if (t.length < 2) continue;
      const a = t[0] + '|' + t[t.length-1]; (fl[a] ||= []).push(k);
    }
    return nome => {
      const k = norm(nome); if (exact.has(k)) return k;
      const t = toks(nome); if (t.length < 2) return null;
      const c = fl[t[0] + '|' + t[t.length-1]]; if (c && c.length === 1) return c[0];
      // all tokens of the shorter contained in the longer, same first name
      // mesmo primeiro nome; demais palavras iguais ou abreviadas (prefixo de 4+ letras)
      let best = null, n = 0, tie = false;
      const rest = t.slice(1);
      for (const cand of names) {
        const ct = cand.split(' ');
        if (ct[0] !== t[0]) continue;
        const hit = rest.filter(x => ct.some(c => c === x || (x.length >= 4 && c.startsWith(x)))).length;
        const ok = hit === rest.length || hit >= 2;
        if (!ok) continue;
        if (hit > n) { best = cand; n = hit; tie = false; } else if (hit === n) tie = true;
      }
      return tie ? null : best;
    };
  }

  /* ---------- Derivações ---------- */
  const ymAdd = (ym, d) => { let [y, m] = ym.split('-').map(Number); m += d; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${String(m).padStart(2,'0')}`; };
  const ymLabel = (ym, longo) => { const [y, m] = ym.split('-').map(Number); return longo ? `${MES_LONGO[m-1]} de ${y}` : `${MES[m-1]}/${String(y).slice(2)}`; };
  const ymCap = ym => { const [y, m] = ym.split('-').map(Number); return MES[m-1][0].toUpperCase() + MES[m-1].slice(1); };
  const monthsBetween = (iso, ym) => { const [y1, m1] = iso.slice(0,7).split('-').map(Number); const [y2, m2] = ym.split('-').map(Number); return (y2 - y1) * 12 + (m2 - m1); };

  function build(base, hoje) {
    // base: {gestao:[...], freq:{meses, alunos}, forms:[...]}
    const todayYm = hoje.slice(0,7);
    const freqKeys = base.freq ? Object.keys(base.freq.alunos) : [];
    const matchFreq = buildMatcher(freqKeys);
    const gestao = base.gestao || [];
    const gKeys = gestao.map(g => norm(g.n));
    const matchG = buildMatcher(gKeys);
    const mesesFechados = base.freq ? base.freq.meses.filter(m => m < todayYm) : [];
    const ultimoFechado = mesesFechados[mesesFechados.length - 1] || null;

    // modalidade por chave de frequência (para médias)
    const modOf = {};
    for (const g of gestao) { const fk = matchFreq(g.n); if (fk && !modOf[fk]) modOf[fk] = /grupo/i.test(g.md) ? 'grp' : 'ind'; }

    // forms por aluno (chave gestão)
    const formsBy = {};
    for (const f of (base.forms || [])) { const gk = matchG(f.n); if (!gk) continue; (formsBy[gk] ||= []).push(f); }
    for (const k in formsBy) formsBy[k].sort((a, b) => (b.dt || '').localeCompare(a.dt || ''));

    const lim90 = new Date(hoje + 'T12:00:00'); lim90.setMonth(lim90.getMonth() - 3);
    const limIso = lim90.toISOString().slice(0,10);

    const alunos = [];
    const seen = new Set();
    for (const g of gestao) {
      if (!/^(ativo|a iniciar)$/i.test(g.st)) continue;
      const key = norm(g.n); if (seen.has(key + '|' + g.id)) continue; seen.add(key + '|' + g.id);
      const fk = matchFreq(g.n);
      const fr = fk ? base.freq.alunos[fk].m : {};
      const forms = formsBy[key] || [];
      const ultimoForm = forms[0] || null;
      let mesesNaTurma = g.ini ? monthsBetween(g.ini, todayYm) : null;
      // 2026 (ano corrente) presença
      const anoAtual = todayYm.slice(0,4);
      let p = 0, t = 0; for (const m of mesesFechados) if (m.startsWith(anoAtual) && fr[m]) { p += fr[m][0]; t += fr[m][0] + fr[m][1]; }
      alunos.push({
        key, slug: slug(g.n + '-' + g.id), ...g,
        consList: g.c.split(/[,;\/]| e /).map(s => s.trim()).filter(Boolean),
        fk, fr, forms, ultimoForm,
        formOk: !!(ultimoForm && ultimoForm.dt && ultimoForm.dt >= limIso),
        mesesNaTurma, presAno: t ? p / t : null, aulasAno: t,
      });
    }
    return {alunos, mesesFechados, ultimoFechado, modOf, freq: base.freq, limIso};
  }

  // fecha trimestre no mês de referência?
  function trimestre(ini, refYm) {
    if (!ini) return null;
    const m = monthsBetween(ini, refYm);
    return (m > 0 && m % 3 === 0) ? m / 3 : null;
  }

  /* ---------- Presença e comparações ---------- */
  function presenca(fr, meses) {
    let p = 0, f = 0; const por = [];
    for (const m of meses) { const v = fr[m]; if (v && v[0] + v[1] > 0) { p += v[0]; f += v[1]; por.push({m, p: v[0], t: v[0] + v[1]}); } }
    return {p, t: p + f, pct: p + f ? p / (p + f) : null, por};
  }
  function bench(freq, modOf, meses, minAulas = 4) {
    const all = [], ind = [], grp = [];
    for (const [k, a] of Object.entries(freq.alunos)) {
      const r = presenca(a.m, meses); if (r.t < minAulas) continue;
      all.push(r.pct); if (modOf[k] === 'ind') ind.push(r.pct); else if (modOf[k] === 'grp') grp.push(r.pct);
    }
    const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
    return {all: avg(all), ind: avg(ind), grp: avg(grp), n: all.length, dist: all.sort((a, b) => a - b)};
  }
  function percentilTop(dist, v) { // % de alunos com presença >= v  (Top X%)
    if (!dist.length || v == null) return null;
    const acima = dist.filter(x => x > v + 1e-9).length;
    return Math.max(1, Math.ceil((acima + 1) / dist.length * 100));
  }
  function streakSemFalta(fr, meses) {
    let best = null, cur = null;
    for (const m of meses) {
      const v = fr[m];
      if (v && v[0] > 0 && v[1] === 0) { cur = cur ? {...cur, fim: m, n: cur.n + 1} : {ini: m, fim: m, n: 1}; if (!best || cur.n >= best.n) best = cur; }
      else if (v && v[0] + v[1] > 0) cur = null; // mês com falta quebra; mês sem aula não quebra
    }
    return best;
  }

  /* ---------- Rota ---------- */
  function rotaIndex(rota) {
    const ids = rota.map(r => r.id); const by = Object.fromEntries(rota.map(r => [r.id, r]));
    const levels = [...new Set(rota.map(r => r.lvl))];
    return {ids, by, levels, ofLevel: l => rota.filter(r => r.lvl === l)};
  }

  return {norm, slug, toks, isoDate, parseGestao, parseFreq, parseForms, build, trimestre, presenca, bench, percentilTop,
    streakSemFalta, rotaIndex, ymAdd, ymLabel, ymCap, monthsBetween, MES, MES_LONGO, LV, LV_DESC, segmentoDe, buildMatcher};
})();
if (typeof module !== 'undefined') module.exports = ENG;
</script>
<script>/* ===== Relatório: contexto, prompt, textos-base e renderização ===== */
const REP = (() => {
  const E = ENG;
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>').replace(/\n+/g, '<br>');
  const pct = v => v == null ? '—' : Math.round(v * 100) + '%';
  const first = n => String(n || '').trim().split(/\s+/)[0] || '';
  const initials = n => String(n || '').trim().split(/\s+/).filter(Boolean).slice(0, 2).map(x => x[0].toUpperCase()).join('');
  const IDIOMA = {ingles:'inglês',espanhol:'espanhol',italiano:'italiano',frances:'francês',portugues:'português'};
  const idiomaLabel = id => IDIOMA[E.norm(id)] || String(id || '').toLowerCase();
  const FEM = ['isabel','raquel','beatriz','ester','carmen','ines','miriam','nicole','alice','tais','elisabeth','ingrid','yasmin','lais','thais','gabrielle','michelle','rachel','evelyn','camile','isabelle','julliely','djanini','hefany','yaneysis','chrisailen','vanuza','carol','malu','lu','gabi','dani','mel','manu','bel','cris','ketlin','kelly','karen','sueli','neusa','ruth','lis','liz','jaqueline','suelen','raissa'];
  const MASC = ['daniel','samuel','gabriel','miguel','rafael','manuel','emanuel','ismael','israel','abel','joel','noel','lucas','jose','luiz','luis','jean','gualter','franco','victor','vitor','cesar','raul','emilio','robson','juliano','haroldo','andrey','thiago','tiago','pedro','guilherme','leonardo','charles','christopher','chris','davi','enzo','luca','joshua','nikita','andrea','arthur','artur','igor','yuri','felipe','henrique','vinicius','marcus','marcos','matheus','mateus','caue','rui','davi','eli','ali','ben','william','kauan','lui','lineker','adfran','achiles','alan','alann','ailvan','alex','alexander','alexandre','adriano','alberto','alessandro','alexmar'];
  const guessGen = nome => { const f = E.norm(first(nome)); if (FEM.includes(f)) return 'f'; if (MASC.includes(f)) return 'm'; if (/a$/.test(f)) return 'f'; if (/(o|son|el|or|er|im|an|ur|us)$/.test(f)) return 'm'; return ''; };
  const guessFem = nome => guessGen(nome) === 'f';

  /* ---------- rota genérica (idiomas sem rota detalhada) ---------- */
  const STEPS = {A1:12,A2:12,B1:12,B2:12,'B2+':12,C1:18,'C1+':18,C2:12};
  function stageList(idioma, rota) {
    if (E.norm(idioma) === 'ingles' && rota) return rota;
    const out = []; for (const l of E.LV) for (let i = 1; i <= STEPS[l]; i++) out.push({id: `${l}.${i}`, lvl: l, n: i, name: '', comp: '', gram: '', vocab: '', prof: '', hab: ''});
    return out;
  }
  const parseStage = s => { const m = String(s || '').toUpperCase().replace(/\s/g, '').match(/^([ABC][12]\+?)\.?(\d{1,2})$/); return m ? `${m[1]}.${+m[2]}` : null; };

  /* ---------- contexto completo do relatório ---------- */
  function buildCtx(a, B, inp, rota, hoje) {
    const g = inp.genero === 'm' ? {art:'o', da:'do', ele:'ele', Aluno:'Aluno', aluno:'aluno', dele:'dele'} : {art:'a', da:'da', ele:'ela', Aluno:'Aluna', aluno:'aluna', dele:'dela'};
    const cg = inp.consGen === 'm' ? {Cons:'Consultor', da:'do', art:'o'} : {Cons:'Consultora', da:'da', art:'a'};
    const tg = guessGen(inp.timoneiro) === 'm' ? 'Timoneiro' : 'Timoneira';
    const voce = inp.audiencia === 'aluno';
    const nome1 = inp.apelido || first(a.n);
    const lang = idiomaLabel(a.id);
    const hasRota = E.norm(a.id) === 'ingles';
    const stages = stageList(a.id, rota);
    const ids = stages.map(s => s.id);
    const atualId = parseStage(inp.atual), partidaId = parseStage(inp.partida);
    let ai = ids.indexOf(atualId), pi = ids.indexOf(partidaId);
    if (ai < 0) ai = 0; if (pi < 0 || pi > ai) pi = ai;
    const atual = stages[ai], partida = stages[pi];
    const lvAtual = atual.lvl, lvPart = partida.lvl;
    const li = E.LV.indexOf(lvAtual), lp = E.LV.indexOf(lvPart);
    const levelsShown = E.LV.slice(lp, li + 1);
    let baseLevel = null;
    if (partida.n === 1 && lp > 0) baseLevel = E.LV[lp - 1];
    const trechoTotal = stages.filter(s => { const k = E.LV.indexOf(s.lvl); return k >= lp && k <= li; }).length - (partida.n - 1);
    const concluidas = ai - pi;
    const proxNivel = E.LV[li + 1] && stages.some(s => s.lvl === E.LV[li + 1]) ? E.LV[li + 1] : null;
    const restantes = stages.filter(s => s.lvl === lvAtual && s.n >= atual.n);
    const restDepois = restantes.length - 1;
    const concl = stages.slice(pi, ai);
    // marcos: até 4 grupos consecutivos
    const nG = Math.min(4, concl.length);
    const grupos = [];
    for (let i = 0; i < nG; i++) { const s = Math.round(i * concl.length / nG), e = Math.round((i + 1) * concl.length / nG); grupos.push(concl.slice(s, e)); }
    const proxEtapas = proxNivel ? stages.filter(s => s.lvl === proxNivel) : [];

    // presença
    const fech = B.mesesFechados;
    const anoAtual = hoje.slice(0, 4);
    const inicioYm = a.ini ? a.ini.slice(0, 7) : null;
    const desdeMeses = fech.filter(m => !inicioYm || m >= inicioYm);
    const per = {
      ano: fech.filter(m => m.startsWith(anoAtual) && (!inicioYm || m >= inicioYm)),
      desde: desdeMeses,
      tri: desdeMeses.slice(-3),
    };
    const P = k => E.presenca(a.fr, per[k]);
    const pres = {ano: P('ano'), desde: P('desde'), tri: P('tri')};
    let periodo = inp.periodo || 'auto';
    if (periodo === 'auto') {
      const bAno = E.bench(B.freq, B.modOf, per.ano);
      periodo = (pres.ano.t < 4 || (pres.ano.pct < bAno.all && pres.desde.pct > pres.ano.pct + 0.03)) ? 'desde' : 'ano';
    }
    const pm = per[periodo]; const pr = pres[periodo];
    const bench = E.bench(B.freq, B.modOf, pm);
    const top = E.percentilTop(bench.dist, pr.pct);
    const rng = ms => ms.length ? (ms[0].slice(0, 4) === ms[ms.length - 1].slice(0, 4)
      ? `${E.MES[+ms[0].slice(5) - 1]} a ${E.MES[+ms[ms.length - 1].slice(5) - 1]} de ${ms[0].slice(0, 4)}`
      : `${E.ymLabel(ms[0])} a ${E.ymLabel(ms[ms.length - 1])}`) : '';
    const perLabel = {ano: `em ${anoAtual}`, desde: (inicioYm && inicioYm > (fech[0] || '')) ? `desde ${E.ymLabel(inicioYm)}` : `desde ${E.ymLabel(fech[0] || '2025-01')}`, tri: `nos últimos 3 meses`}[periodo];
    const anos = [...new Set(desdeMeses.map(m => m.slice(0, 4)))].map(y => {
      const ms = desdeMeses.filter(m => m.startsWith(y)); const r = E.presenca(a.fr, ms);
      const comAula = r.por.map(x => x.m);
      return {ano: y, ...r, rng: comAula.length ? `${E.MES[+comAula[0].slice(5) - 1]} a ${E.MES[+comAula[comAula.length - 1].slice(5) - 1]}` : ''};
    }).filter(x => x.t > 0);
    const streak = E.streakSemFalta(a.fr, desdeMeses);
    const registrosDesde = fech[0];
    const diff = (pr.pct != null && bench.all != null) ? Math.round((pr.pct - bench.all) * 100) : null;

    const f = a.ultimoForm;
    return {a, inp, g, cg, tg, voce, nome1, lang, hasRota, stages, atual, partida, levelsShown, baseLevel, trechoTotal, concluidas,
      proxNivel, restantes, restDepois, grupos, proxEtapas, periodo, pm, pr, pres, bench, top, diff, perLabel, perRange: rng(pm),
      anos, streak, registrosDesde, inicioAntesRegistros: a.ini && a.ini.slice(0, 7) < (registrosDesde || ''), form: f, hoje,
      dataLabel: `${E.ymCap(hoje.slice(0, 7))} ${hoje.slice(0, 4)}`};
  }

  /* ---------- checklist da avaliação (determinístico) ---------- */
  function checklist(c) {
    const f = c.form || {}; const fem = c.inp.genero !== 'm'; const out = [];
    const A = (fe, ma) => fem ? fe : ma;
    if (/^Participativo/i.test(f.part)) out.push(`${A('Participativa', 'Participativo')}: faz perguntas e se envolve nas atividades`);
    else if (/moderada/i.test(f.part)) out.push('Participa e responde quando é chamad' + c.g.art + ' nas atividades');
    if (/^Sim/i.test(f.int)) out.push(`${A('Curiosa e interessada', 'Curioso e interessado')} no que está aprendendo`);
    if (/^Sim/i.test(f.ativ)) out.push('Faz as práticas propostas entre uma aula e outra');
    if (/^Sim/i.test(f.acomp)) out.push('Acompanha o conteúdo do nível sem dificuldades');
    else if (/alguma dificuldade/i.test(f.acomp)) out.push('Avança no conteúdo do nível com constância');
    if (/^Sim$/i.test(f.ritmo)) out.push('Ritmo de evolução dentro do esperado');
    if (/^Motivado/i.test(f.motiv)) out.push(`${A('Motivada', 'Motivado')}, com disposição e confiança`);
    if (/presença consistente/i.test(f.reg) && /antecedência/i.test(f.avisa)) out.push('Pontual e avisa com antecedência quando precisa faltar');
    else if (/presença consistente/i.test(f.reg)) out.push('Presença consistente nas aulas');
    else if (/antecedência/i.test(f.avisa)) out.push('Avisa com antecedência quando precisa faltar');
    return out;
  }

  function prompt(c) {
    return `Você é especialista sênior de Customer Success da CCLi, consultoria linguística brasileira com consultor fixo por aluno e rota de aprendizagem em etapas. Vai redigir os textos de um relatório de desenvolvimento em PDF de 4 páginas. O layout, os números e os gráficos já estão prontos; você escreve só os textos abaixo, em português do Brasil.

REGRAS
- Use só os fatos fornecidos. Nunca invente números, conquistas, frases do consultor ou detalhes pessoais.
- Números citados devem ser exatamente os fornecidos. Só diga "acima da média" se a diferença for positiva.
- Citações do consultor: use apenas trechos que ele realmente escreveu nos campos abertos, positivos e adequados ao público. Pode encurtar, corrigir pontuação e trocar "a aluna/o aluno" pelo nome. Se não houver trecho bom, devolva citacoes vazio e escreva "paragrafo" em terceira pessoa.
- A avaliação do consultor é interna. Nunca exponha críticas, riscos de cancelamento, desmotivação, pouco esforço, ritmo abaixo do esperado ou contexto pessoal sensível. Mantenha só o que é positivo e verdadeiro.

- Estilo: frases curtas e diretas, calorosas sem exagero. Não use travessão (—). Evite trios de adjetivos, clichês motivacionais, "jornada transformadora", "não é só X, é Y". Use **negrito** com moderação (só na carta e nos benefícios).

${c.hasRota ? '' : '- Não há rota detalhada para este idioma: escreva marcos e etapas restantes de forma geral, coerente com o nível CEFR, sem inventar nomes de temas específicos.\n'}

    <div><em>01</em><strong>Da partida até aqui</strong>Nível, etapas e competências</div>
    <div><em>02</em><strong>Constância</strong>Presença nas aulas</div>
    <div><em>03</em><strong>O olhar ${c.cg.da} ${c.cg.Cons.toLowerCase()}</strong>Como ${c.cg.art} ${esc(consF)} vê ${voc ? 'você' : A.art + ' ' + esc(n)}</div>
    <div><em>04</em><strong>${sec4[0]}</strong>${sec4[1]}</div>
  </div>
  ${foot(1)}
</section>`;

    // página 2
    const rows = [];
    const lvls = (c.baseLevel ? [c.baseLevel] : []).concat(c.levelsShown);
    for (const l of lvls) {
      const st = c.stages.filter(s => s.lvl === l);
      if (!st.length) continue;
      const boxes = st.map(s => {
        const ix = c.stages.indexOf(s), ai = c.stages.indexOf(c.atual), pi = c.stages.indexOf(c.partida);
        const cls = ix < pi ? 'base' : ix < ai ? 'd' : ix === ai ? 'c' : '';
        return `<span class="${cls}">${s.n}</span>`;
      }).join('');
      const last = l === c.atual.lvl && c.proxNivel ? `<span class="lvnext">${c.proxNivel}</span>` : '';
      rows.push(`<div class="lvrow"><b>${l}</b><div class="lvbox">${boxes}</div>${last}</div>`);
    }
    const progPct = c.trechoTotal ? Math.round(c.concluidas / c.trechoTotal * 100) : 0;
    const marcos = (T.marcos || []).map((m, i) => {
      const gr = c.grupos[i] || [];
      const rg = gr.length ? (gr.length === 1 ? gr[0].id : `${gr[0].id} a ${gr[gr.length - 1].id}`) : '';
      return `<div class="marco"><div class="eb">Marco ${i + 1}${rg ? ' · ' + rg : ''}</div><h4>${esc(m.titulo)}</h4><ul>${(m.itens || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul>${m.para_vida ? `<div class="pv"><b>Para a vida:</b> ${esc(m.para_vida)}</div>` : ''}</div>`;
    }).join('');
    const p2 = `<section class="pg">${head}
  <div class="eb">01 · Da partida até aqui</div>
  <h2 class="sec-h">${two(T.s1_titulo)}</h2>
  <p class="sec-i">${md(T.s1_intro)}</p>
  <div class="prog">
    <div class="prog-h"><div><div class="eb">Progresso ${c.proxNivel ? `do ${c.partida.lvl} ao ${c.proxNivel}` : 'na rota'}</div><div class="big">${c.concluidas}<span>de ${c.trechoTotal} etapas concluídas</span></div></div><div class="cur">Etapa atual<b>${c.atual.id}</b></div></div>
    <div class="bar"><i style="width:${progPct}%"></i></div>
    ${rows.join('')}
    <div class="legend">${c.baseLevel || c.partida.n > 1 ? `<span><i style="background:#c9e9df"></i>Base que ${ref} já trazia</span>` : ''}<span><i style="background:#45b89b"></i>Concluída${c.baseLevel ? ' na CCLi' : ''}</span><span><i style="background:#e8946a"></i>Em andamento</span><span><i style="border:1px dashed #cfd8d5;background:#fff"></i>Próximas etapas</span>${c.proxNivel ? `<span><i style="background:#25302f"></i>${E.LV_DESC[c.proxNivel][0].toUpperCase() + E.LV_DESC[c.proxNivel].slice(1)}</span>` : ''}</div>
    <div class="agora"><b>Agora, na etapa ${c.atual.id}${c.atual.name ? ' · ' + esc(c.atual.name) : ''}:</b> ${md(T.agora)}</div>
  </div>
  ${marcos ? `<div class="marcos">${marcos}</div>` : ''}
  ${(T.estruturas || []).length ? `<div class="tools"><h4>Estruturas que ${ref} já ${voc ? 'domina' : 'domina'} <span>· a “caixa de ferramentas” do idioma construída até aqui</span></h4><div class="chips">${T.estruturas.map(s => `<span>${esc(s)}</span>`).join('')}</div></div>` : ''}
  ${foot(2)}
</section>`;

    // página 3
    const tiles = c.pr.por.slice(-12);
    const cols = Math.max(tiles.length, 6);
    const tileCls = x => x.t && x.p / x.t >= 0.85 ? '' : x.t && x.p / x.t >= 0.6 ? 'mid' : 'low';
    const months = tiles.length ? `<div class="months" style="grid-template-columns:repeat(${cols},1fr)">${tiles.map(x => `<div><div class="mt ${tileCls(x)}">${x.p}/${x.t}</div><small>${E.ymCap(x.m)}${c.periodo !== 'ano' ? ' ' + x.m.slice(2, 4) : ''}</small></div>`).join('')}</div>` : '<p class="fn">Sem aulas registradas no período.</p>';
    const sk = c.streak && c.streak.n >= 4
      ? `<div class="streak"><b>${c.streak.n}</b><p><strong>meses seguidos sem nenhuma falta</strong>, de ${E.ymLabel(c.streak.ini, true)} a ${E.ymLabel(c.streak.fim, true)}. ${c.inicioAntesRegistros ? `Desde ${E.ymLabel(c.registrosDesde)}` : 'Desde o início'}, são ${c.pres.desde.p} presenças em ${c.pres.desde.t} aulas.</p></div>`
      : `<div class="streak"><b>${c.pres.desde.p}</b><p><strong>presenças em ${c.pres.desde.t} aulas</strong> ${c.inicioAntesRegistros ? `desde ${E.ymLabel(c.registrosDesde, true)}` : 'desde o início'}, uma média de ${pct(c.pres.desde.pct)}.</p></div>`;
    const years = c.anos.slice(-2).map(y => `<div><small>${y.ano} · ${y.rng}</small><b>${pct(y.pct)}</b><span>${y.p} presenças em ${y.t} aulas</span></div>`).join('');
    const bars = [[n, c.pr.pct, true], ['Média · aulas individuais', c.bench.ind], ['Média · aulas em grupo', c.bench.grp], ['Média geral dos alunos', c.bench.all]]
      .filter(b => b[1] != null).sort((x, y) => (y[2] ? 1 : 0) - (x[2] ? 1 : 0))
      .map(b => `<div class="r${b[2] ? ' me' : ''}"><div><span>${esc(b[0])}</span><span>${pct(b[1])}</span></div><i><u style="width:${Math.round(b[1] * 100)}%"></u></i></div>`).join('');
    let badge = '';
    if (c.top != null && c.top <= 25) badge = `<div class="badge"><b>Top ${c.top}%</b><p>${voc ? 'Você está' : `${A.art.toUpperCase()} ${esc(n)} está`} entre os ${c.top}% de alunos da CCLi com maior presença ${c.perLabel}.</p></div>`;
    else if (c.diff != null && c.diff >= 5) badge = `<div class="badge"><b>+${c.diff} pts</b><p>${voc ? 'Sua presença está' : `A presença ${A.da} ${esc(n)} está`} ${c.diff} pontos acima da média geral dos alunos da CCLi.</p></div>`;
    const chk = checklist(c).concat(T.olhar && T.olhar.checklist_extra ? [T.olhar.checklist_extra] : []);
    const cits = (T.olhar && T.olhar.citacoes || []).filter(Boolean).map(q => `<p>“${esc(q.replace(/^["“]|["”]$/g, ''))}”</p>`).join('');
    const parag = T.olhar && T.olhar.paragrafo ? `<p class="plain">${md(T.olhar.paragrafo)}</p>` : '';
    const fdt = c.form && c.form.dt ? `${E.MES[+c.form.dt.slice(5, 7) - 1]} ${c.form.dt.slice(0, 4)}` : '';
    const p3 = `<section class="pg">${head}
  <div class="eb">02 · Constância</div>
  <h2 class="sec-h">${two(T.s2_titulo)}</h2>
  <p class="sec-i">${md(T.s2_intro)}</p>
  <div class="g2">
    <div class="card"><h4>Aula a aula ${c.perLabel}</h4><div class="cap">Presenças / aulas do mês</div>${months}${sk}${years ? `<div class="years">${years}</div>` : ''}</div>
    <div class="card"><h4>Presença ${c.perLabel}, comparada</h4><div class="cap">Média de ${esc(c.perRange)} entre os demais alunos da CCLi</div><div class="cmp">${bars}</div>${badge}</div>
  </div>
  <div class="eb sep-h">03 · O olhar ${c.cg.da} ${c.cg.Cons.toLowerCase()}</div>
  <div class="olhar">
    <div class="card q">${cits}${parag}<div class="who"><i>${initials(cons)}</i><div><b>${esc(cons)}</b><span>${c.cg.Cons} de ${esc(c.lang)} ${A.da} ${esc(n)}</span></div></div></div>
    <div class="check"><h4>Avaliação ${c.cg.da} ${c.cg.Cons.toLowerCase()}${fdt ? ' · ' + fdt : ''}</h4><ul>${chk.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
  </div>
  <p class="fn" style="margin-top:12px">Presença = aulas com presença ÷ (presenças + faltas). ${c.inicioAntesRegistros ? `Registros a partir de ${E.ymLabel(c.registrosDesde)}. ` : ''}Base: demais alunos da CCLi, ${esc(c.perRange)}.</p>
  ${foot(3)}
</section>`;

    // página 4
    let left;
    if (c.restDepois === 0) {
      left = `<div class="now-box"><div class="eb">Agora · ${c.atual.id}</div><h4>${esc(c.atual.name || 'Etapa atual')}</h4><p>${md(T.agora_reta_final || T.agora)}</p>${c.proxNivel ? `<div class="nx">Ao concluir esta etapa, ${voc ? 'você entra' : `${A.art} ${esc(n)} entra`} no <b>${c.proxNivel}</b> ${E.LV_DESC[c.proxNivel]}.</div>` : ''}</div>`;
    } else {
      left = `<div class="card"><h4>O que vem no restante do ${c.atual.lvl}</h4><div class="rest" style="margin-top:8px">${c.restantes.map((s, i) => `<div class="${i === 0 ? 'now' : ''}"><b>${s.id}</b><span>${esc(i === 0 ? (s.name || T.agora) : (T.restantes && T.restantes[s.id]) || s.name)}</span><em>${i === 0 ? 'agora' : ''}</em></div>`).join('')}</div></div>`;
    }
    const acel = T.acelera && T.acelera.titulo ? `<div class="acel"><div class="eb">O que acelera a chegada</div><h4>${esc(T.acelera.titulo)}</h4><p>${md(T.acelera.texto)}</p><ul>${(T.acelera.itens || []).map(x => `<li>${md(x)}</li>`).join('')}</ul></div>` : '';
    const pn = T.proximo_nivel && c.proxNivel ? `<div class="dark"><div class="eb">Ao chegar no ${c.proxNivel}, na prática</div><h3>${esc(T.proximo_nivel.titulo)}</h3><p>${md(T.proximo_nivel.intro)}</p><ul>${(T.proximo_nivel.beneficios || []).map(x => `<li>${md(x)}</li>`).join('')}</ul>${c.proxEtapas.length ? `<div class="tm"><small>Alguns temas do ${c.proxNivel}</small><div class="chips">${c.proxEtapas.filter(s => s.name).slice(0, 5).map(s => `<span>${esc(s.name)}</span>`).join('')}</div></div>` : ''}</div>` : '';
    const contato = `Qualquer dúvida, é só chamar ${c.cg.art} ${esc(consF)} ou a equipe CCLi.`;
    const p4 = `<section class="pg">${head}
  <div class="eb">04 · ${sec4[0]}</div>
  <h2 class="sec-h">${two(T.s4_titulo)}</h2>
  <p class="sec-i">${md(T.s4_intro)}</p>
  <div class="g4"><div>${left}${acel}</div><div>${pn}</div></div>
  <div class="team" style="margin-top:auto"><div><b>${esc(cons)}</b><span>${c.cg.Cons} de ${esc(c.lang)} ${A.da} ${esc(n)}</span></div>${c.inp.timoneiro ? `<div><b>${esc(c.inp.timoneiro)}</b><span>${c.tg} · apoio pedagógico</span></div>` : '<div></div>'}<div><b>Equipe CCLi</b><span>Sucesso do Cliente</span></div></div>
  <div class="close"><p>${esc(T.fechamento)}</p><small>${contato}</small></div>
  ${foot(4)}
</section>`;
    return p1 + p2 + p3 + p4;
  }

  return {guessGen, buildCtx, prompt, fallback, render, checklist, facts, parseStage, stageList, first, guessFem, idiomaLabel, esc, pct};
})();
if (typeof module !== 'undefined') module.exports = REP;
</script>
<script>/* ===== App: painel de alunos + editor de relatório ===== */
(() => {
  const E = ENG, R = REP;
  const ROTA = JSON.parse(document.getElementById('d-rota').textContent);
  const CONS = JSON.parse(document.getElementById('d-cons').textContent);
  const LOGO = document.getElementById('d-logo').textContent.trim();
  const $ = (s, el = document) => el.querySelector(s);
  const esc = R.esc;
  const pad = n => String(n).padStart(2, '0');
  const now = new Date();
  const HOJE = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  const fmtD = iso => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}` : '—';
  const fmtDT = ts => { try { const d = new Date(ts); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; } catch { return ''; } };

  const S = {
    raw: {gestao: null, freq: null, forms: null}, meta: null, B: null,
    seg: 'Todos', q: '', cons: '', idioma: '', ref: HOJE.slice(0, 7), soTri: false, soPend: false, sort: 'nome',
    sel: new Set(), view: 'list', queue: [], qi: 0, relidx: {},
    db: null, user: null, sample: null, downloads: null, canUpload: true, uploadOpen: false,
    pending: {}, ed: null,
  };

  /* ---------- utilidades ---------- */
  function toast(msg, ms = 3200) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), ms); }
  async function copy(text, btn) {
    try { await navigator.clipboard.writeText(text); toast('Mensagem copiada.'); }
    catch { const box = btn && btn.closest('.note') && btn.closest('.note').querySelector('.msgbox'); if (box) { const r = document.createRange(); r.selectNodeContents(box); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast('Selecione o texto e copie com Ctrl/Cmd+C.'); }
  }
  const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  function timoneiroDe(consNome) {
    const t = E.toks(consNome); if (!t.length) return '';
    let best = null, n = 0;
    for (const [c, tm] of CONS) { const ct = E.toks(c); if (ct[0] !== t[0]) continue; const hit = t.filter(x => ct.includes(x)).length; if (hit > n) { n = hit; best = tm; } }
    return n >= Math.min(2, t.length) ? best : '';
  }

  /* ---------- persistência (db) ---------- */
  const CH = {g: 500, f: 450, o: 90};
  async function loadBase() {
    if (!S.db) { const loc = null; return loc; }
    const m = await S.db.doc('base/meta').get();
    if (!m.exists) return null;
    const meta = m.data();
    const get = async (p, n) => { const out = []; const docs = await Promise.all(Array.from({length: n}, (_, i) => S.db.doc(`base/${p}${i}`).get())); for (const d of docs) if (d.exists) out.push(d.data()); return out; };
    const [g, f, o] = await Promise.all([get('g', meta.n?.g || 0), get('f', meta.n?.f || 0), get('o', meta.n?.o || 0)]);
    const raw = {gestao: g.length ? g.flatMap(x => x.rows) : null, freq: f.length ? {meses: meta.freqMeses || [], alunos: Object.assign({}, ...f.map(x => x.a))} : null, forms: o.length ? o.flatMap(x => x.rows) : null};
    return {meta, raw};
  }
  async function saveBase(which) {
    const meta = {...(S.meta || {}), n: {...(S.meta?.n || {})}};
    const writes = [];
    const old = S.meta?.n || {};
    if (which.g && S.raw.gestao) { const rows = S.raw.gestao; const n = Math.ceil(rows.length / CH.g); for (let i = 0; i < n; i++) writes.push(['g' + i, {rows: rows.slice(i * CH.g, (i + 1) * CH.g)}]); for (let i = n; i < (old.g || 0); i++) writes.push(['g' + i, null]); meta.n.g = n; meta.gestao = {arquivo: which.g, em: Date.now(), linhas: rows.length}; }
    if (which.f && S.raw.freq) { const ent = Object.entries(S.raw.freq.alunos); const n = Math.ceil(ent.length / CH.f); for (let i = 0; i < n; i++) writes.push(['f' + i, {a: Object.fromEntries(ent.slice(i * CH.f, (i + 1) * CH.f))}]); for (let i = n; i < (old.f || 0); i++) writes.push(['f' + i, null]); meta.n.f = n; meta.freqMeses = S.raw.freq.meses; meta.freq = {arquivo: which.f, em: Date.now(), ate: S.raw.freq.meses[S.raw.freq.meses.length - 1]}; }
    if (which.o && S.raw.forms) { const rows = S.raw.forms; const n = Math.ceil(rows.length / CH.o); for (let i = 0; i < n; i++) writes.push(['o' + i, {rows: rows.slice(i * CH.o, (i + 1) * CH.o)}]); for (let i = n; i < (old.o || 0); i++) writes.push(['o' + i, null]); meta.n.o = n; const ds = rows.map(r => r.dt).filter(Boolean).sort(); meta.forms = {arquivo: which.o, em: Date.now(), ate: ds[ds.length - 1] || null, linhas: rows.length}; }
    if (which.link != null) meta.formsLink = which.link;
    S.meta = meta;
    if (!S.db) return 'local';
    for (const [id, body] of writes) { const ref = S.db.doc('base/' + id); if (body) await ref.set(body); else await ref.delete(); }
    await S.db.doc('base/meta').set(meta);
    return 'db';
  }

  function rebuild() {
    if (!S.raw.gestao) { S.B = null; return; }
    S.B = E.build({gestao: S.raw.gestao, freq: S.raw.freq || {meses: [], alunos: {}}, forms: S.raw.forms || []}, HOJE);
  }

  /* ---------- cabeçalho ---------- */
  function renderHeader() {
    const m = S.meta || {};
    const p = (on, txt) => `<span class="pill${on ? '' : ' off'}"><i></i>${txt}</span>`;
    $('#hdr-status').innerHTML =
      p(!!S.raw.gestao, S.raw.gestao ? `Gestão · ${m.gestao ? fmtD(new Date(m.gestao.em).toISOString().slice(0, 10)) : 'carregada'}` : 'Gestão pendente') +
      p(!!S.raw.freq, S.raw.freq ? `Frequência até ${E.ymLabel(S.B?.ultimoFechado || S.raw.freq.meses.slice(-1)[0])}` : 'Frequência pendente') +
      p(!!S.raw.forms, S.raw.forms ? `Forms até ${fmtD(m.forms?.ate || [...S.raw.forms.map(r => r.dt).filter(Boolean)].sort().pop())}` : 'Forms pendente') +
      (S.canUpload ? `<button class="btn sm ghost-on-dark" data-act="upload">${S.uploadOpen ? 'Fechar atualização' : 'Atualizar planilhas'}</button>` : '') +
      (window.__sair ? `<button class="btn sm ghost-on-dark" data-act="sair">Sair</button>` : '');
  }

  /* ---------- upload ---------- */
  function renderUpload() {
    const box = $('#upload');
    if (!S.canUpload || (!S.uploadOpen && S.raw.gestao)) { box.hidden = true; return; }
    box.hidden = false;
    const d = (k, t, h) => { const st = S.pending[k]; return `<label class="drop ${st?.ok ? 'ok' : st?.err ? 'err' : ''}" data-drop="${k}"><b>${t}</b><span>${st?.ok ? esc(st.ok) : st?.err ? esc(st.err) : h}</span><input type="file" accept=".xlsx,.xls" data-file="${k}" id="file-${k}"></label>`; };
    const any = Object.values(S.pending).some(x => x.ok);
    box.innerHTML = `<div class="panel">
      <div class="row" style="justify-content:space-between"><div><h3 style="font-family:var(--f-disp);margin:0;font-size:15px">Atualizar planilhas</h3><p class="muted small" style="margin:4px 0 0">Envie uma ou mais. A rota de navegação já está embutida no painel.${S.db ? ' Ao salvar, a base fica disponível para todos os consultores.' : ' Sem armazenamento compartilhado nesta visualização: os dados ficam só nesta aba.'}</p></div></div>
      <div class="upl">${d('g', 'Gestão Geral', 'Aba "Alunos" · .xlsx')}${d('f', 'Frequência', 'Abas por mês (Jan26, Fev26…) · .xlsx')}${d('o', 'Forms do consultor', 'Respostas do formulário CS → Consultor · .xlsx')}</div>
      <div class="row"><label class="field" style="flex:1;min-width:240px"><span>Link do formulário do consultor (aparece no pedido de preenchimento)</span><input type="text" id="forms-link" placeholder="https://forms.gle/…" value="${esc(S.meta?.formsLink || '')}"></label>
      <button class="btn pri" data-act="save-base" ${any || (S.meta && ($('#forms-link')?.value ?? '') !== (S.meta.formsLink || '')) ? '' : ''}>${S.db ? 'Salvar e publicar para a equipe' : 'Aplicar'}</button></div>
    </div>`;
  }
  async function readFile(k, file) {
    S.pending[k] = {ok: 'Lendo…'}; renderUpload();
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type: 'array'});
      if (k === 'g') { const rows = E.parseGestao(wb, XLSX); S.pending.g = {ok: `${file.name} · ${rows.length} linhas`, data: rows, name: file.name}; }
      if (k === 'f') { const fr = E.parseFreq(wb, XLSX); S.pending.f = {ok: `${file.name} · ${fr.meses.length} meses (${E.ymLabel(fr.meses[0])} a ${E.ymLabel(fr.meses[fr.meses.length - 1])})`, data: fr, name: file.name}; }
      if (k === 'o') { const fo = E.parseForms(wb, XLSX); S.pending.o = {ok: `${file.name} · ${fo.length} respostas`, data: fo, name: file.name}; }
    } catch (e) { S.pending[k] = {err: 'Não consegui ler: ' + (e.message || e)}; }
    renderUpload();
  }
  async function applyUpload() {
    const which = {};
    if (S.pending.g?.data) { S.raw.gestao = S.pending.g.data; which.g = S.pending.g.name; }
    if (S.pending.f?.data) { S.raw.freq = S.pending.f.data; which.f = S.pending.f.name; }
    if (S.pending.o?.data) { S.raw.forms = S.pending.o.data; which.o = S.pending.o.name; }
    const link = $('#forms-link')?.value.trim() ?? '';
    if (link !== (S.meta?.formsLink || '')) which.link = link;
    if (!Object.keys(which).length) { toast('Escolha pelo menos uma planilha.'); return; }
    const btn = $('[data-act="save-base"]'); if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Salvando…'; }
    try {
      const where = await saveBase(which);
      S.pending = {}; S.uploadOpen = false; rebuild(); renderAll();
      toast(where === 'db' ? 'Base atualizada para toda a equipe.' : 'Base aplicada nesta aba.');
    } catch (e) {
      if (btn) { btn.disabled = false; btn.textContent = 'Tentar de novo'; }
      toast(e && e.code === 'invalid_argument' ? 'Só editores do painel podem atualizar a base.' : e && e.code === 'quota_exceeded' ? 'O armazenamento do painel está cheio.' : 'Não foi possível salvar agora. Tente de novo em instantes.', 5000);
    }
  }

  /* ---------- lista ---------- */
  function filtered() {
    if (!S.B) return [];
    const q = E.norm(S.q);
    let l = S.B.alunos.filter(a =>
      (S.seg === 'Todos' || a.sg === S.seg) &&
      (!S.cons || a.consList.includes(S.cons)) &&
      (!S.idioma || a.id === S.idioma) &&
      (!q || E.norm(a.n + ' ' + a.emp + ' ' + a.c).includes(q)) &&
      (!S.soTri || E.trimestre(a.ini, S.ref)) &&
      (!S.soPend || !a.formOk));
    const by = {nome: (a, b) => a.n.localeCompare(b.n), ltv: (a, b) => b.ltv - a.ltv, ini: (a, b) => (a.ini || '').localeCompare(b.ini || ''), pres: (a, b) => (a.presAno ?? 2) - (b.presAno ?? 2)}[S.sort];
    return l.sort(by);
  }
  function renderList() {
    const el = $('#view');
    if (!S.B) {
      el.innerHTML = `<div class="panel empty"><h2>${S.loading ? 'Carregando a base…' : 'Nenhuma base carregada ainda'}</h2><p>${S.loading ? '' : S.canUpload ? 'Envie a Gestão Geral, a Frequência e o Forms do consultor no painel acima para listar os alunos.' : 'A equipe de Sucesso do Cliente ainda não publicou as planilhas. Volte mais tarde.'}</p></div>`;
      return;
    }
    const all = S.B.alunos;
    const cnt = s => all.filter(a => s === 'Todos' || a.sg === s).length;
    const consOpts = [...new Set(all.flatMap(a => a.consList))].sort((a, b) => a.localeCompare(b));
    const idOpts = [...new Set(all.map(a => a.id).filter(Boolean))].sort();
    const refOpts = [-2, -1, 0, 1, 2].map(d => E.ymAdd(HOJE.slice(0, 7), d));
    const list = filtered();
    const triN = list.filter(a => E.trimestre(a.ini, S.ref));
    const triPend = triN.filter(a => !a.formOk).length;
    const refL = E.ymLabel(S.ref, true);
    const presCls = v => v == null ? '' : v >= 0.75 ? '' : v >= 0.5 ? 'mid' : 'low';
    el.innerHTML = `
    <div class="filters">
      <div class="tabs" role="tablist">${['Todos', 'Insigna', 'Proprietário'].map(s => `<button role="tab" class="${S.seg === s ? 'on' : ''}" data-seg="${s}">${s}<em>${cnt(s)}</em></button>`).join('')}</div>
      <input type="search" id="f-q" placeholder="Buscar aluno, empresa ou consultor" value="${esc(S.q)}" style="flex:1;min-width:200px">
      <select id="f-cons" aria-label="Consultor"><option value="">Todos os consultores</option>${consOpts.map(c => `<option ${S.cons === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
      <select id="f-id" aria-label="Idioma"><option value="">Todos os idiomas</option>${idOpts.map(c => `<option ${S.idioma === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
    </div>
    <div class="filters">
      <label class="field"><span>Mês de referência do trimestre</span><select id="f-ref">${refOpts.map(m => `<option value="${m}" ${S.ref === m ? 'selected' : ''}>${E.ymLabel(m, true)}</option>`).join('')}</select></label>
      <label class="chk"><input type="checkbox" id="f-tri" ${S.soTri ? 'checked' : ''}> Só quem fecha trimestre em ${refL}</label>
      <label class="chk"><input type="checkbox" id="f-pend" ${S.soPend ? 'checked' : ''}> Só com forms pendente</label>
    </div>
    <div class="summary">
      <div class="sum"><b>${list.length}</b><span>alunos ativos no filtro</span></div>
      <div class="sum hot"><b>${triN.length}</b><span>fecham trimestre em ${refL}</span></div>
      <div class="sum"><b>${triPend}</b><span>desses, sem forms nos últimos 3 meses</span></div>
      <div class="sum"><b>${list.filter(a => S.relidx[a.slug]).length}</b><span>já têm relatório salvo</span></div>
    </div>
    <div class="tblwrap"><table>
      <thead><tr>
        <th style="width:34px"><input type="checkbox" id="sel-all" aria-label="Selecionar todos do filtro" ${list.length && list.every(a => S.sel.has(a.slug)) ? 'checked' : ''}></th>
        <th class="s" data-sort="nome">Aluno${S.sort === 'nome' ? ' ↓' : ''}</th><th>Canal</th><th>Idioma · nível</th><th>Consultor</th>
        <th class="s" data-sort="ltv">LTV${S.sort === 'ltv' ? ' ↓' : ''}</th><th class="s" data-sort="ini">Início${S.sort === 'ini' ? ' ↓' : ''}</th><th>Término previsto</th>
        <th class="s" data-sort="pres">Presença ${HOJE.slice(0, 4)}${S.sort === 'pres' ? ' ↑' : ''}</th><th>Trimestre</th><th>Forms consultor</th><th>Relatório</th>
      </tr></thead>
      <tbody>${list.length ? list.map(a => {
        const tq = E.trimestre(a.ini, S.ref);
        const rel = S.relidx[a.slug];
        return `<tr class="${S.sel.has(a.slug) ? 'sel' : ''}" data-row="${a.slug}">
          <td><input type="checkbox" data-sel="${a.slug}" aria-label="Selecionar ${esc(a.n)}" ${S.sel.has(a.slug) ? 'checked' : ''}></td>
          <td class="nm"><b>${esc(a.n)}</b><small>${esc(a.emp && !['--', '-', 'a'].includes(a.emp) ? a.emp : a.vi)} · ${esc(a.md)}${a.st !== 'Ativo' ? ' · ' + esc(a.st) : ''}</small></td>
          <td><span class="tag ${a.sg === 'Insigna' ? 'ins' : 'pro'}">${a.sg}</span></td>
          <td>${esc(a.id)} · ${esc(a.nv)}</td>
          <td>${esc(a.c)}</td>
          <td class="num">${a.ltv} ${a.ltv === 1 ? 'mês' : 'meses'}</td>
          <td class="num">${fmtD(a.ini)}</td>
          <td class="num">${a.ter ? fmtD(a.ter) : '<span class="muted">—</span>'}</td>
          <td class="num">${a.presAno == null ? '<span class="muted">sem aulas</span>' : `<span class="meter"><i class="${presCls(a.presAno)}" style="width:${Math.round(a.presAno * 100)}%"></i></span>${Math.round(a.presAno * 100)}%`}</td>
          <td>${tq ? `<span class="tag tri">${tq}º trimestre</span>` : '<span class="muted small">—</span>'}</td>
          <td>${a.formOk ? `<span class="tag ok">${fmtD(a.ultimoForm.dt)}</span>` : a.ultimoForm ? `<span class="tag warn" title="Mais de 3 meses">${fmtD(a.ultimoForm.dt)}</span>` : '<span class="tag bad">Sem resposta</span>'}</td>
          <td>${rel ? `<span class="small">${fmtDT(rel.at)}</span>` : '<span class="muted small">—</span>'}</td>
        </tr>`;
      }).join('') : `<tr><td colspan="12" class="empty">Nenhum aluno neste filtro.</td></tr>`}</tbody>
    </table></div>`;
    renderActbar();
  }
  function renderActbar() {
    const bar = $('#actbar');
    if (S.view !== 'list' || !S.sel.size) { bar.hidden = true; return; }
    const sel = S.B.alunos.filter(a => S.sel.has(a.slug));
    const pend = sel.filter(a => !a.formOk);
    bar.hidden = false;
    bar.innerHTML = `<div class="wrap"><span><b>${sel.length}</b> ${sel.length === 1 ? 'aluno selecionado' : 'alunos selecionados'}${pend.length ? ` · ${pend.length} sem forms recente` : ''}</span>
      <div class="row">${pend.length ? `<button class="btn sm ghost-on-dark" data-act="pedido-lote">Copiar pedido aos consultores</button>` : ''}<button class="btn sm ghost-on-dark" data-act="limpar">Limpar seleção</button><button class="btn pri" data-act="gerar">Gerar ${sel.length === 1 ? 'relatório' : 'relatórios'}</button></div></div>`;
  }

  function pedidoMsg(consNome, alunos) {
    const c = R.first(consNome);
    const link = S.meta?.formsLink ? `\n${S.meta.formsLink}` : '';
    if (alunos.length === 1) {
      const a = alunos[0];
      return `Oi, ${c}! Vou preparar o relatório de desenvolvimento de ${a.n}. Para isso preciso da sua avaliação atualizada no formulário CS → Consultor (${a.ultimoForm ? 'a última é de ' + fmtD(a.ultimoForm.dt) : 'ainda não temos nenhuma'}). Consegue preencher esta semana?${link}`;
    }
    return `Oi, ${c}! Vou preparar os relatórios de desenvolvimento destes alunos e preciso da sua avaliação atualizada no formulário CS → Consultor:\n${alunos.map(a => `• ${a.n}${a.ultimoForm ? ' (última: ' + fmtD(a.ultimoForm.dt) + ')' : ''}`).join('\n')}\nConsegue preencher esta semana?${link}`;
  }

  /* ---------- editor ---------- */
  function defaultsFor(a) {
    const cons = a.consList[0] || a.c;
    const corp = /empresa/i.test(a.vi) || /corporativo/i.test(a.rf) || a.sg === 'Insigna';
    const nv = E.LV.includes(a.nv) ? a.nv : 'A1';
    return {
      partida: `${nv}.1`, atual: '', genero: R.guessGen(a.n), apelido: R.first(a.n),
      audiencia: 'aluno', destinatario: '', consNome: cons, consGen: R.guessGen(cons) || 'f',
      timoneiro: timoneiroDe(cons), periodo: 'auto', obs: '', corp,
    };
  }
  async function openEditor(slugs) {
    S.queue = slugs; S.qi = 0; S.view = 'editor';
    await loadEd();
  }
  async function loadEd() {
    const a = S.B.alunos.find(x => x.slug === S.queue[S.qi]);
    let saved = null;
    if (S.db) { try { const d = await S.db.doc('rel/' + a.slug).get(); if (d.exists) saved = d.data(); } catch {} }
    if (!saved) saved = lsGet('rel:' + a.slug);
    S.ed = {a, inp: {...defaultsFor(a), ...(saved?.inp || {})}, T: saved?.T || null, savedAt: saved?.at || null, busy: false, err: ''};
    renderAll(); window.scrollTo(0, 0);
  }
  function stageOptions(idioma, sel) {
    const st = R.stageList(idioma, ROTA);
    const isEn = E.norm(idioma) === 'ingles';
    let out = '<option value="">Escolha…</option>', lv = '';
    for (const s of st) { if (s.lvl !== lv) { if (lv) out += '</optgroup>'; out += `<optgroup label="${s.lvl}">`; lv = s.lvl; } out += `<option value="${s.id}" ${sel === s.id ? 'selected' : ''}>${s.id}${isEn && s.name ? ' · ' + esc(s.name) : ''}</option>`; }
    return out + '</optgroup>';
  }
  function ctxNow() { const {a, inp} = S.ed; return R.buildCtx(a, S.B, inp, ROTA, HOJE); }

  function renderEditor() {
    const {a, inp, T} = S.ed;
    const el = $('#view');
    const tq = E.trimestre(a.ini, S.ref);
    const gate = a.formOk;
    const f = a.ultimoForm;
    const consFirst = a.consList[0] || a.c;
    const gateHtml = gate
      ? `<div class="note ok"><b class="t">Avaliação do consultor em dia</b>Respondida em ${fmtD(f.dt)} por ${esc(f.cons || consFirst)}.<details style="margin-top:6px"><summary class="small">Ver respostas</summary><ul class="small" style="margin:6px 0 0;padding-left:18px;line-height:1.5">${[['Regularidade', f.reg], ['Participação', f.part], ['Interesse', f.int], ['Atividades entre aulas', f.ativ], ['Acompanha o nível', f.acomp], ['Ritmo', f.ritmo], ['Motivação', f.motiv], ['Contexto', f.ctx], ['Maior risco', f.risco], ['Recomendação', f.rec]].filter(x => x[1]).map(x => `<li><b>${x[0]}:</b> ${esc(x[1])}</li>`).join('')}</ul></details></div>`
      : `<div class="note bad"><b class="t">Antes de gerar, peça a avaliação ao consultor</b>${f ? `A última resposta do forms é de ${fmtD(f.dt)}, há mais de 3 meses.` : 'Não há resposta do forms do consultor para este aluno.'} Solicite o preenchimento a <b>${esc(consFirst)}</b> e gere o relatório depois que a planilha do forms for atualizada no painel.
         <div class="msgbox">${esc(pedidoMsg(consFirst, [a]))}</div><button class="btn sm" data-act="copiar-pedido">Copiar mensagem</button></div>`;
    const isEn = E.norm(a.id) === 'ingles';
    const stageField = (id, label, val) => isEn
      ? `<label class="field"><span>${label}</span><select id="${id}" data-inp="${id.slice(3)}">${stageOptions(a.id, val)}</select></label>`
      : `<label class="field"><span>${label}</span><input type="text" id="${id}" data-inp="${id.slice(3)}" placeholder="ex.: B1.4" value="${esc(val)}"></label>`;
    const ready = gate && R.parseStage(inp.atual) && inp.genero;
    el.innerHTML = `<div class="ed">
      <div class="ed-side">
        <div class="panel">
          <div class="who-h"><div><button class="btn sm" data-act="voltar">← Lista</button></div>${S.queue.length > 1 ? `<div class="qnav"><button class="btn sm" data-act="q-prev" ${S.qi ? '' : 'disabled'} aria-label="Anterior">‹</button>${S.qi + 1} de ${S.queue.length}<button class="btn sm" data-act="q-next" ${S.qi < S.queue.length - 1 ? '' : 'disabled'} aria-label="Próximo">›</button></div>` : ''}</div>
          <h2 style="font-family:var(--f-disp);font-size:18px;margin:12px 0 0">${esc(a.n)}</h2>
          <div class="chips-a"><span class="tag ${a.sg === 'Insigna' ? 'ins' : 'pro'}">${a.sg}</span><span class="tag pro">${esc(a.id)} · ${esc(a.nv)}</span><span class="tag pro">${esc(a.c)}</span><span class="tag pro">LTV ${a.ltv}m</span><span class="tag pro">Início ${fmtD(a.ini)}</span>${a.ter ? `<span class="tag pro">Término ${fmtD(a.ter)}</span>` : ''}${tq ? `<span class="tag tri">${tq}º trimestre em ${E.ymLabel(S.ref)}</span>` : ''}</div>
        </div>
        ${gateHtml}
        <div class="panel"><h3>Dados do relatório</h3>
          <div class="grid2">
            ${stageField('in-partida', 'Etapa em que começou', inp.partida)}
            ${stageField('in-atual', 'Etapa atual (Integra)', inp.atual)}
            <label class="field"><span>${esc(R.first(a.n))} é</span><select id="in-genero" data-inp="genero">${inp.genero ? '' : '<option value="" selected>Escolha…</option>'}<option value="f" ${inp.genero === 'f' ? 'selected' : ''}>Aluna</option><option value="m" ${inp.genero === 'm' ? 'selected' : ''}>Aluno</option></select></label>
            <label class="field"><span>Como chamar no texto</span><input type="text" id="in-apelido" data-inp="apelido" value="${esc(inp.apelido)}"></label>
            <label class="field"><span>Relatório para</span><select id="in-audiencia" data-inp="audiencia"><option value="aluno" ${inp.audiencia === 'aluno' ? 'selected' : ''}>O próprio aluno</option><option value="rh" ${inp.audiencia === 'rh' ? 'selected' : ''} ${inp.corp ? '' : 'disabled'}>RH da empresa${inp.corp ? '' : ' (só corporativo)'}</option><option value="familia" ${inp.audiencia === 'familia' ? 'selected' : ''}>Família / responsável</option></select></label>
            <label class="field"><span>Nome de quem recebe ${inp.audiencia === 'aluno' ? '(opcional)' : ''}</span><input type="text" id="in-destinatario" data-inp="destinatario" placeholder="${inp.audiencia === 'rh' ? 'ex.: Juliana, do RH' : inp.audiencia === 'familia' ? 'ex.: Fernando' : ''}" value="${esc(inp.destinatario)}"></label>
            <label class="field"><span>Consultor no relatório</span><input type="text" id="in-consNome" data-inp="consNome" value="${esc(inp.consNome)}"></label>
            <label class="field"><span>Gênero do consultor</span><select id="in-consGen" data-inp="consGen"><option value="f" ${inp.consGen === 'f' ? 'selected' : ''}>Consultora</option><option value="m" ${inp.consGen === 'm' ? 'selected' : ''}>Consultor</option></select></label>
            <label class="field"><span>Timoneiro(a)</span><input type="text" id="in-timoneiro" data-inp="timoneiro" value="${esc(inp.timoneiro)}"></label>
            <label class="field"><span>Período de presença</span><select id="in-periodo" data-inp="periodo">${[['auto', 'Automático'], ['ano', `Ano de ${HOJE.slice(0, 4)}`], ['desde', 'Desde o início dos registros'], ['tri', 'Últimos 3 meses']].map(o => `<option value="${o[0]}" ${inp.periodo === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select></label>
            <label class="field full"><span>Observações para o texto (opcional)</span><textarea id="in-obs" data-inp="obs" rows="2" placeholder="ex.: está se preparando para um intercâmbio em 2027">${esc(inp.obs)}</textarea></label>
          </div>
          <div class="row" style="margin-top:12px">
            <button class="btn pri" data-act="redigir" ${S.sample ? '' : 'hidden'} ${ready && S.sample && !S.ed.busy ? '' : 'disabled'}>${S.ed.busy ? '<span class="spin"></span> Redigindo…' : T ? 'Redigir de novo com Claude' : 'Redigir com Claude'}</button>
            <button class="btn${S.sample ? '' : ' pri'}" data-act="base" ${ready && !S.ed.busy ? '' : 'disabled'}>Usar texto-base</button>
          </div>
          <p class="muted small" style="margin:8px 0 0">${!gate ? 'Bloqueado até chegar a avaliação do consultor.' : !R.parseStage(inp.atual) ? 'Informe a etapa atual do aluno, como está no Integra.' : !inp.genero ? 'Indique se é aluna ou aluno para os textos saírem com a concordância certa.' : S.sample ? 'Claude redige os textos a partir dos dados; você revisa e edita tudo antes de baixar.' : 'Clique em "Usar texto-base" e revise os textos antes de baixar: troque as frases genéricas por exemplos do aluno e inclua trechos da avaliação do consultor.'}${S.ed.err ? `<br><span style="color:var(--bad)">${esc(S.ed.err)}</span>` : ''}</p>
        </div>
        ${T ? textEditor(T) : ''}
        ${T ? `<div class="panel"><h3>Baixar</h3><div class="row"><button class="btn pri" data-act="pdf">Baixar PDF</button><button class="btn" data-act="html">Baixar HTML</button><button class="btn" data-act="salvar">Salvar rascunho</button></div><p class="muted small" style="margin:8px 0 0">${S.ed.savedAt ? 'Último salvamento: ' + fmtDT(S.ed.savedAt) + '. ' : ''}O rascunho fica salvo para a equipe e reabre ao voltar a este aluno.</p></div>` : ''}
      </div>
      <div class="prev"><div class="prev-box"><div class="prev-h"><b style="font-family:var(--f-disp);font-size:14px">Prévia do relatório</b><span class="muted small">${T ? 'A4 · 4 páginas' : 'Aparece aqui depois da redação'}</span></div><div id="prev-host"></div></div></div>
    </div>`;
    renderPreview();
  }
  function textEditor(T) {
    const ta = (k, label, v, rows = 2) => `<div class="txf"><label for="tx-${k}">${label}</label><textarea id="tx-${k}" data-tx="${k}" rows="${rows}">${esc(v ?? '')}</textarea></div>`;
    const inp = (k, label, v) => `<div class="txf"><label for="tx-${k}">${label}</label><input type="text" id="tx-${k}" data-tx="${k}" value="${esc(v ?? '')}"></div>`;
    const lines = a => (a || []).join('\n');
    const c = ctxNow();
    return `<div class="panel"><h3>Textos do relatório</h3><p class="muted small" style="margin:-4px 0 6px">Edite à vontade. Em títulos, o trecho depois de "|" sai em verde. Listas: um item por linha.</p>
      <details class="tx" open><summary>Capa</summary>${ta('subtitulo', 'Subtítulo', T.subtitulo)}${ta('carta', 'Carta de abertura', T.carta, 5)}${ta('citacao_capa', 'Citação do consultor na capa (vazio = sem citação)', T.citacao_capa)}</details>
      <details class="tx"><summary>01 · Da partida até aqui</summary>${inp('s1_titulo', 'Título', T.s1_titulo)}${ta('s1_intro', 'Introdução', T.s1_intro, 3)}${ta('agora', 'Agora, na etapa atual', T.agora, 3)}
        ${(T.marcos || []).map((m, i) => `${inp(`marcos.${i}.titulo`, `Marco ${i + 1} · título`, m.titulo)}${ta(`marcos.${i}.itens`, `Marco ${i + 1} · o que já consegue fazer`, lines(m.itens), 3)}${inp(`marcos.${i}.para_vida`, `Marco ${i + 1} · para a vida`, m.para_vida)}`).join('')}
        ${ta('estruturas', 'Estruturas já dominadas', lines(T.estruturas), 4)}</details>
      <details class="tx"><summary>02 · Constância e 03 · Olhar do consultor</summary>${inp('s2_titulo', 'Título', T.s2_titulo)}${ta('s2_intro', 'Introdução', T.s2_intro, 3)}${ta('olhar.citacoes', 'Citações do consultor (uma por linha)', lines(T.olhar?.citacoes), 4)}${ta('olhar.paragrafo', 'Parágrafo sobre a avaliação', T.olhar?.paragrafo, 3)}${inp('olhar.checklist_extra', 'Item extra na lista da avaliação', T.olhar?.checklist_extra)}
        <p class="muted small" style="margin:6px 0 0">Itens da avaliação gerados das respostas do forms: ${R.checklist(c).map(esc).join(' · ') || 'nenhum positivo marcado'}.</p></details>
      <details class="tx"><summary>04 · ${c.restDepois === 0 ? 'A reta final' : 'Próximas conquistas'}</summary>${inp('s4_titulo', 'Título', T.s4_titulo)}${ta('s4_intro', 'Introdução', T.s4_intro, 3)}
        ${c.restDepois === 0 ? ta('agora_reta_final', 'Texto da etapa final', T.agora_reta_final, 3) : Object.keys(T.restantes || {}).map(k => inp(`restantes.${k}`, `Etapa ${k}`, T.restantes[k])).join('')}
        ${T.proximo_nivel ? `${inp('proximo_nivel.titulo', 'Próximo nível · título', T.proximo_nivel.titulo)}${ta('proximo_nivel.intro', 'Próximo nível · introdução', T.proximo_nivel.intro)}${ta('proximo_nivel.beneficios', 'Próximo nível · na prática (um por linha)', lines(T.proximo_nivel.beneficios), 5)}` : ''}
        <label class="chk" style="margin-top:8px"><input type="checkbox" id="tx-acel-on" ${T.acelera ? 'checked' : ''}> Incluir bloco "O que acelera a chegada"</label>
        ${T.acelera ? `${inp('acelera.titulo', 'Bloco · título', T.acelera.titulo)}${ta('acelera.texto', 'Bloco · texto', T.acelera.texto, 3)}${ta('acelera.itens', 'Bloco · combinações (uma por linha)', lines(T.acelera.itens), 3)}` : ''}
        ${inp('fechamento', 'Frase de fechamento', T.fechamento)}</details>
    </div>`;
  }
  const LIST_KEYS = /(\.itens|estruturas|citacoes|beneficios)$/;
  function setTx(path, val) {
    const T = S.ed.T; const parts = path.split('.'); let o = T;
    for (let i = 0; i < parts.length - 1; i++) { const p = parts[i]; o[p] ??= /^\d+$/.test(parts[i + 1]) ? [] : {}; o = o[p]; }
    o[parts[parts.length - 1]] = LIST_KEYS.test(path) ? val.split('\n').map(s => s.trim()).filter(Boolean) : val;
  }
  let prevTimer = null;
  function renderPreview() {
    const host = $('#prev-host'); if (!host) return;
    if (!S.ed.T) { host.innerHTML = `<div class="empty small">${S.ed.a.formOk ? 'Preencha a etapa atual e clique em "Redigir com Claude".' : 'Aguardando a avaliação do consultor.'}</div>`; return; }
    const html = R.render(ctxNow(), S.ed.T, LOGO);
    const w = host.clientWidth || 600; const sc = Math.min(1, w / 794);
    host.innerHTML = `<div style="height:${Math.ceil((1123 * 4 + 72) * sc)}px"><div class="prev-scale rp" style="width:794px;transform:scale(${sc})">${html}</div></div>`;
  }
  const schedulePreview = () => { clearTimeout(prevTimer); prevTimer = setTimeout(renderPreview, 250); };

  async function redigir() {
    const c = ctxNow();
    S.ed.busy = true; S.ed.err = ''; renderEditor();
    const t0 = Date.now();
    const tick = setInterval(() => { const b = $('[data-act="redigir"]'); if (b) b.innerHTML = `<span class="spin"></span> Redigindo… ${Math.round((Date.now() - t0) / 1000)}s`; }, 1000);
    try {
      const out = await S.sample.json(R.prompt(c), {modelTier: 'default'});
      const base = R.fallback(c);
      const T = {...base, ...out};
      T.olhar = {...base.olhar, ...(out.olhar || {})};
      T.restantes = {...base.restantes, ...(out.restantes || {})};
      if (!Array.isArray(T.marcos) || T.marcos.length !== c.grupos.length) T.marcos = base.marcos;
      if (c.proxNivel && !T.proximo_nivel) T.proximo_nivel = base.proximo_nivel;
      S.ed.T = T;
    } catch (e) {
      S.ed.err = {not_granted: 'Permissão para usar o Claude foi negada nesta página.', rate_limited: 'Muitas solicitações seguidas. Espere um minuto e tente de novo.', invalid_json: 'A resposta veio incompleta. Tente de novo.'}[e && e.code] || 'Não foi possível redigir agora. Tente de novo ou use o texto-base.';
    } finally { clearInterval(tick); S.ed.busy = false; renderEditor(); }
  }

  async function salvar(silent) {
    const {a, inp, T} = S.ed; const at = Date.now();
    const body = {at, inp, T, aluno: a.n};
    lsSet('rel:' + a.slug, body);
    S.relidx[a.slug] = {at, etapa: inp.atual};
    let ok = true;
    if (S.db) { try { await S.db.doc('rel/' + a.slug).set(body); await S.db.doc('relidx/' + a.slug).set({at, etapa: inp.atual}); } catch (e) { ok = false; } }
    S.ed.savedAt = at;
    if (!silent) toast(ok ? 'Rascunho salvo.' : 'Salvo só neste navegador (sem permissão para salvar na base da equipe).');
    renderEditor();
  }

  function fileBase() { const {a} = S.ed; return `Relatorio_Desenvolvimento_${a.n.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '')}`; }
  async function baixarPDF() {
    if (!S.downloads) { toast('Download indisponível nesta visualização.', 5000); return; }
    const btn = $('[data-act="pdf"]'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Gerando PDF…';
    const off = $('#offscreen');
    try {
      off.innerHTML = `<div class="rp">${R.render(ctxNow(), S.ed.T, LOGO)}</div>`;
      try { await document.fonts.ready; } catch {}
      const pages = [...off.querySelectorAll('.pg')];
      const pdf = new jspdf.jsPDF({unit: 'px', format: [794, 1123], orientation: 'portrait', hotfixes: ['px_scaling'], compress: true});
      for (let i = 0; i < pages.length; i++) {
        pages[i].style.margin = '0';
        const cv = await html2canvas(pages[i], {scale: 2, backgroundColor: '#f8f6f1', useCORS: true, logging: false, width: 794, height: 1123, windowWidth: 794});
        if (i) pdf.addPage([794, 1123], 'portrait');
        pdf.addImage(cv.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 794, 1123);
      }
      const blob = pdf.output('blob');
      await salvar(true);
      await S.downloads.save({filename: fileBase() + '.pdf', data: blob});
      toast('PDF baixado.');
    } catch (e) {
      if (e && e.code === 'declined') toast('Download cancelado.');
      else toast('Não foi possível gerar o PDF. Tente "Baixar HTML" e imprima como PDF.', 5000);
    } finally { off.innerHTML = ''; btn.disabled = false; btn.textContent = 'Baixar PDF'; }
  }
  async function baixarHTML() {
    if (!S.downloads) { toast('Download indisponível nesta visualização.', 4000); return; }
    const css = document.getElementById('report-css').textContent;
    const doc = `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(fileBase())}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital@1&family=Sora:wght@600;700&display=swap"><style>${css}
@page{size:A4;margin:0}body{margin:0;background:#d9d6cf}.rp{display:flex;flex-direction:column;align-items:center;padding:24px 0}.pg{box-shadow:0 2px 12px rgba(0,0,0,.12)}
@media print{body{background:none}.rp{padding:0}.pg{box-shadow:none;margin:0!important;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}.dica{display:none}}
.dica{font:13px Inter,sans-serif;text-align:center;padding:12px;background:#154843;color:#fff}</style></head><body><div class="dica">Para salvar em PDF: Ctrl+P (ou Cmd+P) → Salvar como PDF · Margens: nenhuma · Gráficos de plano de fundo: ativado</div><div class="rp">${R.render(ctxNow(), S.ed.T, LOGO)}</div></body></html>`;
    try { await salvar(true); await S.downloads.save({filename: fileBase() + '.html', data: doc}); toast('HTML baixado.'); }
    catch (e) { if (e && e.code === 'declined') toast('Download cancelado.'); else toast('Não foi possível baixar agora.'); }
  }

  /* ---------- render geral + eventos ---------- */
  function renderAll() {
    renderHeader(); renderUpload();
    if (S.view === 'editor' && S.ed) { $('#actbar').hidden = true; renderEditor(); } else { S.view = 'list'; renderList(); }
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act],[data-seg],[data-sort],[data-row]');
    if (!t) return;
    if (t.dataset.seg) { S.seg = t.dataset.seg; renderList(); return; }
    if (t.dataset.sort) { S.sort = t.dataset.sort; renderList(); return; }
    if (t.dataset.row && !e.target.closest('input')) { const s = t.dataset.row; S.sel.has(s) ? S.sel.delete(s) : S.sel.add(s); renderList(); return; }
    const act = t.dataset.act;
    if (act === 'sair') window.__sair();
    else if (act === 'upload') { S.uploadOpen = !S.uploadOpen; renderHeader(); renderUpload(); }
    else if (act === 'save-base') applyUpload();
    else if (act === 'limpar') { S.sel.clear(); renderList(); }
    else if (act === 'gerar') { const order = filtered().map(a => a.slug).filter(s => S.sel.has(s)); const rest = [...S.sel].filter(s => !order.includes(s)); openEditor(order.concat(rest)); }
    else if (act === 'pedido-lote') {
      const sel = S.B.alunos.filter(a => S.sel.has(a.slug) && !a.formOk); const by = {};
      for (const a of sel) (by[a.consList[0] || a.c] ||= []).push(a);
      const txt = Object.entries(by).map(([c, l]) => `— Para ${c} —\n${pedidoMsg(c, l)}`).join('\n\n');
      copy(txt, t);
    }
    else if (act === 'copiar-pedido') copy(pedidoMsg(S.ed.a.consList[0] || S.ed.a.c, [S.ed.a]), t);
    else if (act === 'voltar') { S.view = 'list'; S.ed = null; renderAll(); }
    else if (act === 'q-prev') { S.qi--; loadEd(); }
    else if (act === 'q-next') { S.qi++; loadEd(); }
    else if (act === 'redigir') redigir();
    else if (act === 'base') { S.ed.T = R.fallback(ctxNow()); renderEditor(); }
    else if (act === 'salvar') salvar();
    else if (act === 'pdf') baixarPDF();
    else if (act === 'html') baixarHTML();
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.file && t.files[0]) readFile(t.dataset.file, t.files[0]);
    else if (t.dataset.sel) { t.checked ? S.sel.add(t.dataset.sel) : S.sel.delete(t.dataset.sel); renderList(); }
    else if (t.id === 'sel-all') { for (const a of filtered()) t.checked ? S.sel.add(a.slug) : S.sel.delete(a.slug); renderList(); }
    else if (t.id === 'f-cons') { S.cons = t.value; renderList(); }
    else if (t.id === 'f-id') { S.idioma = t.value; renderList(); }
    else if (t.id === 'f-ref') { S.ref = t.value; renderList(); }
    else if (t.id === 'f-tri') { S.soTri = t.checked; renderList(); }
    else if (t.id === 'f-pend') { S.soPend = t.checked; renderList(); }
    else if (t.dataset.inp && S.ed) {
      S.ed.inp[t.dataset.inp] = t.value;
      if (['partida', 'atual', 'audiencia', 'periodo', 'genero', 'consGen'].includes(t.dataset.inp)) renderEditor(); else schedulePreview();
    }
    else if (t.id === 'tx-acel-on' && S.ed?.T) { S.ed.T.acelera = t.checked ? (S.ed.T._acel || {titulo: 'A regularidade faz toda a diferença', texto: '', itens: []}) : null; if (!t.checked) S.ed.T._acel = S.ed.T.acelera; renderEditor(); }
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'f-q') { S.q = t.value; clearTimeout(S._qt); S._qt = setTimeout(() => { const pos = t.selectionStart; renderList(); const n = $('#f-q'); n.focus(); n.setSelectionRange(pos, pos); }, 220); }
    else if (t.dataset.tx && S.ed?.T) { setTx(t.dataset.tx, t.value); schedulePreview(); }
    else if (t.dataset.inp && S.ed && t.tagName !== 'SELECT') { S.ed.inp[t.dataset.inp] = t.value; schedulePreview(); }
  });
  document.addEventListener('dragover', e => { const d = e.target.closest('.drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
  document.addEventListener('dragleave', e => { const d = e.target.closest('.drop'); if (d) d.classList.remove('over'); });
  document.addEventListener('drop', e => { const d = e.target.closest('.drop'); if (d) { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) readFile(d.dataset.drop, f); } });
  window.addEventListener('resize', () => { if (S.view === 'editor') schedulePreview(); });

  /* ---------- início ---------- */
  async function boot() {
    S.loading = true; renderAll();
    const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
    const [db, user, sample, downloads] = await Promise.all([use('db'), use('user'), use('sample'), use('downloads')]);
    Object.assign(S, {db, user, sample, downloads});
    if (user) { try { S.canUpload = !!(await user.canEdit()); } catch { S.canUpload = false; } }
    else S.canUpload = !db;
    if (db) {
      try { const r = await loadBase(); if (r) { S.meta = r.meta; S.raw = r.raw; } } catch (e) { toast('Não foi possível ler a base agora. Recarregue a página.', 5000); }
      try { db.collection('relidx').onSnapshot(snap => { const m = {}; for (const d of snap.docs) m[d.id] = d.data(); S.relidx = m; if (S.view === 'list') renderList(); }, () => {}); } catch {}
      try { db.doc('base/meta').onSnapshot(async d => { if (!d.exists || !S.meta || d.data().gestao?.em === S.meta.gestao?.em && d.data().freq?.em === S.meta.freq?.em && d.data().forms?.em === S.meta.forms?.em) return; const r = await loadBase(); if (r) { S.meta = r.meta; S.raw = r.raw; rebuild(); renderAll(); toast('Base atualizada pela equipe de CS.'); } }, () => {}); } catch {}
    }
    S.loading = false; rebuild(); renderAll();
  }
  boot();
})();
</script>
</body></html>
